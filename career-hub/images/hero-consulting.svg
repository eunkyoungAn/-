<g><circle cx="175" cy="214" r="24" fill="#fcd5c0"/><path d="M151 210c0-22 14-32 26-32s24 10 24 28c-10-8-28-6-50 4z" fill="#2e1065"/>
<path d="M135 330c0-50 18-82 40-82s40 32 40 82z" fill="#f5f3ff"/><path d="M165 250l10 22 10-22" fill="#7c3aed"/></g>
