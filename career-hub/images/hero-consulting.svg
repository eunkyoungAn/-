<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="커리어 컨설턴트와 학생이 함께 커리어 로드맵을 그리는 일러스트">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#3b0a7a"/></linearGradient>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9d5ff"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
<radialGradient id="halo" cx=".7" cy=".25" r=".6"><stop offset="0" stop-color="#f0abfc" stop-opacity=".55"/><stop offset="1" stop-color="#f0abfc" stop-opacity="0"/></radialGradient>
</defs>
<rect x="10" y="10" width="540" height="440" rx="36" fill="url(#bg)"/>
<rect x="10" y="10" width="540" height="440" rx="36" fill="url(#halo)"/>
<g stroke="#a78bfa" stroke-opacity=".25"><path d="M10 120h540M10 230h540M10 340h540M150 10v440M290 10v440M430 10v440"/></g>
