<rect x="60" y="110" width="150" height="54" rx="16" fill="#fff"/><path d="M150 162l14 18 2-18z" fill="#fff"/>
<text x="76" y="134" font-size="13" fill="#5b21b6">어떤 경험이</text><text x="76" y="152" font-size="13" fill="#5b21b6">가장 즐거웠나요?</text>
<rect x="326" y="104" width="172" height="54" rx="16" fill="#facc15"/><path d="M380 156l-6 20 18-20z" fill="#facc15"/>
<text x="340" y="128" font-size="13" fill="#3b0764">동아리에서 웹사이트를</text><text x="340" y="146" font-size="13" fill="#3b0764">만들었어요!</text>
</g>
<g fill="#fde68a"><path d="M300 70l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/><path d="M90 60l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" opacity=".8"/></g>
<text x="40" y="54" font-family="sans-serif" font-size="11" letter-spacing="3" fill="#ddd6fe" font-weight="700">1:1 CAREER CONSULTING</text>
