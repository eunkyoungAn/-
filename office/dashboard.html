<title>멍멍 에이전트 사무실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* Layout: status ledger — one row per team member, current work then next work as cards, grouped by department */
:root{
  --bg:#FBFAF7; --surface:#FFFFFF; --ink:#26221D; --muted:#7A736A; --line:#ECE7DF;
  --orange-bg:#FBE3BE; --orange-bd:#F0C887; --orange-ink:#8A5413;
  --green-bg:#E3F3DC; --green-bd:#BCE0AE; --green-ink:#3D6B2E;
  --gray-bg:#EFEDEA; --gray-bd:#DEDAD4; --gray-ink:#6E6860;
  --link:#7A4A12;
  --display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#191714; --surface:#221F1B; --ink:#EEE9E2; --muted:#A39B90; --line:#34302A;
  --orange-bg:#4A3418; --orange-bd:#6E4E22; --orange-ink:#F6C987;
  --green-bg:#24361F; --green-bd:#3A5531; --green-ink:#B5DDA4;
  --gray-bg:#2B2824; --gray-bd:#3B3731; --gray-ink:#B3ACA2; --link:#F6C987; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191714; --surface:#221F1B; --ink:#EEE9E2; --muted:#A39B90; --line:#34302A;
  --orange-bg:#4A3418; --orange-bd:#6E4E22; --orange-ink:#F6C987;
  --green-bg:#24361F; --green-bd:#3A5531; --green-ink:#B5DDA4;
  --gray-bg:#2B2824; --gray-bd:#3B3731; --gray-ink:#B3ACA2; --link:#F6C987; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
.wrap{max-width:1200px;margin:0 auto;padding-block:28px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px}
h1{font-family:var(--display);font-weight:400;font-size:2rem;margin:0}
.when{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.lead{margin:0;color:var(--muted);font-size:.92rem;max-width:80ch}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-block;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid}
.c-orange{background:var(--orange-bg);border-color:var(--orange-bd);color:var(--orange-ink)}
.c-green{background:var(--green-bg);border-color:var(--green-bd);color:var(--green-ink)}
.c-gray{background:var(--gray-bg);border-color:var(--gray-bd);color:var(--gray-ink)}
.hint{font-size:.8rem;color:var(--muted)}
.scroller{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:960px}
th{text-align:left;font-size:.8rem;font-weight:600;color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--line)}
td{vertical-align:top;padding:16px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
td.dept{font-weight:600;width:96px}
td.who{width:150px}
.member{display:grid;grid-template-columns:44px 1fr;gap:4px 10px;align-items:center}
.member svg{width:44px;height:44px;overflow:visible;grid-row:span 2}
.member b{font-size:.95rem}
.member .breed{font-size:.72rem;color:var(--muted)}
.member .chip{grid-column:2;justify-self:start;margin-top:2px}
.cards{display:flex;flex-wrap:wrap;gap:8px}
td.now .cards{flex-direction:column;max-width:240px}
.card{width:220px;border:1px solid;border-radius:8px;padding:10px 12px;display:grid;gap:4px;min-height:84px}
.card small{font-size:.72rem;opacity:.85}
.card strong{font-size:.9rem;line-height:1.35;color:var(--ink)}
.card a{justify-self:end;font-size:.75rem;color:var(--link);text-decoration:underline;text-underline-offset:2px}
.card.c-gray strong{color:var(--gray-ink)}
.empty{font-size:.82rem;color:var(--muted);padding-top:6px}
.note{font-size:.82rem;color:var(--muted);margin:0}
@media (max-width:640px){h1{font-size:1.6rem}}
</style>

<div class="wrap">
  <div class="top"><h1>부서별 현황</h1><span class="when" id="when"></span></div>
  <p class="lead" id="lead"></p>
  <div class="legend">
    <span class="chip c-orange">작업 중 / 할 예정</span>

  <span class="hint">표 전체를 좌우로 넘겨 다음 할 일을 확인해요 →</span>
  <div class="scroller"><table>
    <thead><tr><th>부서</th><th>담당</th><th>현재 상태</th><th>다음 할 일</th></tr></thead>
    <tbody id="rows"></tbody>

  <p class="note">저장소 main과 작업 브랜치의 <code>office/</code> 폴더 파일을 기준으로 정리했어요. "게시 대기"는 결과물이 완성되어 블로그·인스타에 올리기만 하면 되는 상태예요.</p>
</div>

function status(r){

  if(r.now.some(x=>x.c==="green")) return ["게시 대기","green"];
  return ["대기 중","gray"];
}
