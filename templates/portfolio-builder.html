<title>커리어캐쳐 포트폴리오 빌더</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Mono&display=swap">
<style>
/* Layout: 좌측 입력 시트 / 우측 결과 미리보기, 좁으면 세로로 쌓임 */
:root{
  --bg:#f3f5f2; --panel:#ffffff; --fg:#1d2420; --muted:#5d6a62; --line:#d6ddd8;
  --accent:#1f6f54; --accent-fg:#ffffff; --soft:#e4efe9;
  --display:"Gowun Batang",Georgia,serif; --body:"IBM Plex Sans KR",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--panel:#1a211e;--fg:#e6ece8;--muted:#9aa8a0;--line:#2d3833;--accent:#5cc49b;--accent-fg:#0e1512;--soft:#203029;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121715;--panel:#1a211e;--fg:#e6ece8;--muted:#9aa8a0;--line:#2d3833;--accent:#5cc49b;--accent-fg:#0e1512;--soft:#203029;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:24px}
header h1{font-family:var(--display);font-size:clamp(26px,4vw,36px);margin:0;text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted);max-width:65ch}
.brand{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
form{display:grid;gap:18px}
fieldset{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:16px;margin:0;display:grid;gap:12px;min-width:0}
legend{font-weight:600;padding:0 6px}
legend small{font-weight:400;color:var(--muted)}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.row{grid-template-columns:1fr}}
input,textarea,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;box-sizing:border-box}
textarea{min-height:72px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:600;border-radius:6px;padding:10px 18px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button:disabled{opacity:.55;cursor:wait}
.out{position:sticky;top:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0;max-height:calc(100vh - 32px);overflow:auto}
.out-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.status{font-family:var(--mono);font-size:12px;color:var(--muted)}
.doc h2{font-family:var(--display);font-size:22px;margin:4px 0 12px;text-wrap:balance}
.doc h3{font-size:16px;margin:20px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.doc table{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0}
.doc .tw{overflow-x:auto}
.doc th,.doc td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.doc th{background:var(--soft)}
.doc ul{padding-left:20px;margin:6px 0}
.doc .need{background:var(--soft);color:var(--accent);font-family:var(--mono);font-size:12px;padding:1px 6px;border-radius:4px}
.tag{font-family:var(--mono);font-size:11px;background:var(--soft);color:var(--accent);padding:2px 8px;border-radius:999px}
.note{font-size:13px;color:var(--muted)}
</style>

<div class="wrap">
  <header>
    <div class="brand">CareerCatcher · Portfolio Builder</div>
    <h1>프로젝트 한 장 포트폴리오 빌더</h1>
    <p>아는 만큼만 채우고 <b>포트폴리오 생성</b>을 누르세요. 비운 칸은 지어내지 않고 <span class="tag">보완 필요</span>로 표시해요. 결과는 노션에 바로 붙여넣을 수 있어요.</p>
  </header>

  <div class="grid">
    <form id="f">
      <fieldset>
        <legend>1. 지원 정보</legend>
        <div class="row">
          <label>직군<select id="field">
            <option>개발 (백엔드/프론트/앱)</option><option>데이터·AI</option><option>디자인 (UX/UI)</option><option>기획·PM</option><option>기타</option>
          </select></label>
          <label>지원 직무<input id="role" placeholder="예: 백엔드 개발자 (신입)"></label>
        </div>
        <label>채용공고 핵심 내용 <small>(선택, 붙여넣기)</small><textarea id="jd" placeholder="자격요건·우대사항을 붙여넣으면 키워드를 매칭해요"></textarea></label>
      </fieldset>

      <fieldset>
        <legend>2. 프로젝트 기본</legend>
        <div class="row">
          <label>프로젝트명<input id="name"></label>
          <label>기간<input id="period" placeholder="2025.03~06 (4개월)"></label>
        </div>
        <label>형태·팀 구성<input id="team" placeholder="팀 4명 (BE 2, FE 1, 디자인 1)"></label>
        <label>주제·배경 (누구의 어떤 문제?)<textarea id="topic"></textarea></label>
        <label>기술 스택<input id="stack" placeholder="Java, Spring Boot, MySQL, Redis, AWS"></label>
        <label>링크 <small>(GitHub·배포·영상)</small><input id="links"></label>
      </fieldset>

      <fieldset>
        <legend>3. 역할과 구현</legend>
        <label>내가 맡은 일 (편하게 나열)<textarea id="myrole" placeholder="검색 API 개발, DB 설계, 배포 담당…"></textarea></label>
        <label>기여도<input id="contrib" placeholder="예: 60%"></label>
        <label>핵심 기능과 구현 방법·기술 선택 이유<textarea id="impl" placeholder="실시간 채팅 - WebSocket 사용, 폴링보다 서버 부하가 적어서"></textarea></label>
      </fieldset>

      <fieldset>
        <legend>4. 성과 <small>· 숫자가 있으면 꼭</small></legend>
        <label>정량 성과 (전/후, 측정 방법)<textarea id="result" placeholder="검색 응답 3.2초 → 0.8초 (JMeter로 측정)"></textarea></label>
        <label>기타 성과 (수상·사용자 반응·배포)<input id="etc"></label>
      </fieldset>

      <fieldset>
        <legend>5. 문제해결과 태도</legend>
        <label>가장 막혔던 문제와 해결 과정<textarea id="trouble" placeholder="무슨 문제 → 원인은 어떻게 찾았나 → 어떤 대안을 비교했나 → 결과"></textarea></label>
        <label>협업 장면 (갈등 해결·먼저 제안한 것)<textarea id="collab"></textarea></label>
        <label>AI 활용과 검증 방법 <small>(선택)</small><textarea id="ai"></textarea></label>
        <label>아쉬운 점·배운 점<textarea id="retro"></textarea></label>
      </fieldset>

      <div class="actions">
        <button type="submit" class="primary" id="go">포트폴리오 생성</button>
        <button type="button" id="ex">예시로 채우기</button>
        <button type="button" id="clr">입력 지우기</button>
      </div>
    </form>

    <section class="out" aria-live="polite">
      <div class="out-head">
        <span class="status" id="st">미리보기 · 예시 결과</span>
        <button type="button" id="copy">마크다운 복사</button>
      </div>
      <div class="doc" id="doc"></div>
      <p class="note" id="na" hidden>이 화면에서는 AI 생성을 쓸 수 없어요. claude.ai에 로그인한 상태에서 열어 주세요.</p>
    </section>
  </div>
</div>

<script>
const ids=["field","role","jd","name","period","team","topic","stack","links","myrole","contrib","impl","result","etc","trouble","collab","ai","retro"];
const labels={field:"직군",role:"지원 직무",jd:"채용공고",name:"프로젝트명",period:"기간",team:"형태·팀 구성",topic:"주제·배경",stack:"기술 스택",links:"링크",myrole:"내가 맡은 일",contrib:"기여도",impl:"핵심 기능·구현·기술 선택 이유",result:"정량 성과",etc:"기타 성과",trouble:"문제해결 과정",collab:"협업 장면",ai:"AI 활용과 검증",retro:"아쉬운 점·배운 점"};
const $=id=>document.getElementById(id);
const EX={field:"개발 (백엔드/프론트/앱)",role:"백엔드 개발자 (신입)",jd:"Java/Spring 기반 API 개발 경험, RDBMS 설계 이해, 성능 개선 경험 우대, 협업 커뮤니케이션",name:"동네마켓 - 중고거래 웹서비스",period:"2025.03~06 (4개월)",team:"팀 4명 (BE 2, FE 1, 디자인 1)",topic:"동네 단위 중고거래에서 검색이 느리고 거래 약속이 자주 깨지는 문제",stack:"Java 17, Spring Boot, MySQL, Redis, AWS EC2, GitHub Actions",links:"github.com/example/dongne-market",myrole:"검색 API 개발, 상품·채팅 DB 설계, CI/CD 구축",contrib:"60%",impl:"상품 검색 - MySQL 인덱스 + Redis 캐시, 조회가 많아서\n실시간 채팅 - WebSocket(STOMP), 폴링보다 서버 부하가 적어서",result:"검색 응답 3.2초 → 0.8초 (JMeter 100명 동시 접속 측정)",etc:"교내 캡스톤 우수상, 베타 사용자 120명",trouble:"상품이 1만 건을 넘자 검색이 느려짐 → 슬로우쿼리 로그로 LIKE 전체 스캔 확인 → 풀텍스트 인덱스와 Elasticsearch를 비교, 기간 내 적용 가능한 인덱스+캐시 선택 → 0.8초로 단축",collab:"PR 리뷰가 밀려 리뷰 규칙(24시간 내, 2인 승인)을 제안함 → 머지 대기 2일→0.5일",ai:"테스트 코드 초안을 AI로 만들고 경계값 케이스를 직접 추가해 검증",retro:"초기에 부하테스트를 하지 않아 성능 이슈를 늦게 발견함. 다음엔 설계 단계에서 성능 목표를 정할 것"};
const SAMPLE=`## 검색 응답 0.8초로 개선한 중고거래 웹서비스 — Spring Boot · Redis · MySQL
| 항목 | 내용 |
|---|---|
| 프로젝트명 / 기간 / 형태 | 동네마켓 / 2025.03~06 / 팀 4명 |
| 나의 역할 (기여도) | 백엔드 · 검색 API 담당 (60%) |
| 증명하는 직무역량 | API 개발 · DB 설계 · 성능 개선 · 협업 |
### 정량적 성과
| 지표 | Before | After | 측정 방법 |
|---|---|---|---|
| 검색 응답시간 | 3.2s | 0.8s | JMeter 동시 100명 |
### 문제해결 과정
- **문제**: 상품 1만 건 이후 검색 지연
- **원인 분석**: 슬로우쿼리 로그로 LIKE 전체 스캔 확인
- **해결**: 풀텍스트 인덱스 vs Elasticsearch 비교 → 인덱스+Redis 캐시 선택
- **결과**: 응답 75% 단축
(왼쪽 양식을 채우고 생성하면 전체 문서가 만들어져요)`;
let md=SAMPLE;

function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\[보완 필요[^\]]*\]/g,m=>`<span class="need">${m}</span>`)}
function render(text){
  const L=text.split("\n");let h="",i=0;
  while(i<L.length){const l=L[i];
    if(l.startsWith("|")){const rows=[];while(i<L.length&&L[i].startsWith("|")){rows.push(L[i]);i++}
      const cells=r=>r.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const body=rows.filter((r,k)=>k!==1||!/^[\s|:-]+$/.test(r));
      h+='<div class="tw"><table>'+body.map((r,k)=>"<tr>"+cells(r).map(c=>k===0?`<th>${inline(c)}</th>`:`<td>${inline(c)}</td>`).join("")+"</tr>").join("")+"</table></div>";continue}
    if(/^\s*[-*] /.test(l)){h+="<ul>";while(i<L.length&&/^\s*[-*] /.test(L[i])){h+="<li>"+inline(L[i].replace(/^\s*[-*] /,""))+"</li>";i++}h+="</ul>";continue}
    if(l.startsWith("### "))h+="<h3>"+inline(l.slice(4))+"</h3>";
    else if(l.startsWith("## "))h+="<h2>"+inline(l.slice(3))+"</h2>";
    else if(l.startsWith("# "))h+="<h2>"+inline(l.slice(2))+"</h2>";
    else if(l.trim())h+="<p>"+inline(l)+"</p>";
    i++}
  $("doc").innerHTML=h;
}
render(md);

function fill(o){ids.forEach(k=>{$(k).value=o[k]||($(k).tagName==="SELECT"?$(k).options[0].text:"")});save()}
function save(){try{localStorage.setItem("cc-pf",JSON.stringify(Object.fromEntries(ids.map(k=>[k,$(k).value]))))}catch(e){}}
try{const s=JSON.parse(localStorage.getItem("cc-pf")||"null");if(s)fill(s)}catch(e){}
$("f").addEventListener("input",save);
$("ex").onclick=()=>fill(EX);
$("clr").onclick=()=>fill({});

function prompt(){
  const data=ids.map(k=>`- ${labels[k]}: ${$(k).value.trim()||"(미입력)"}`).join("\n");
  return `너는 커리어캐쳐(CareerCatcher)의 포트폴리오 코치다. 아래 구직자 입력으로 노션에 붙여넣을 프로젝트 포트폴리오 1장을 한국어 마크다운으로 작성하라.

[구직자 입력]
${data}

[규칙]
- 입력에 없는 사실·수치는 절대 만들지 않는다. 비어 있거나 부족하면 "[보완 필요: 무엇을 적으면 좋은지]"로 표시한다.
- 태도는 형용사 대신 행동 장면으로 쓴다. 문장은 짧은 개조식으로 쓴다.
- 채용공고가 있으면 핵심 키워드를 뽑아 '증명하는 직무역량'에 매칭한다. 없으면 직군의 일반 핵심역량으로 매칭한다.
- 직군에 맞게 '구현 내용' 제목을 바꾼다 (디자인: 디자인 의사결정, 데이터: 분석·모델링, 기획: 기획·지표 설계).
- 마크다운은 ##, ###, 표(|), 목록(-), **굵게**만 사용한다. 코드블록으로 감싸지 않는다.

[출력 양식]
## (성과를 담은 한 줄 요약) — (핵심 기술 2~3개)
| 항목 | 내용 |  (프로젝트명/기간/형태, 주제·배경, 나의 역할(기여도), 기술 스택, 증명하는 직무역량, 링크)
### 역할 분담   (팀 역할 한 줄 + 내가 맡은 일을 동사형 3~5개)
### 구현 내용   (표: 기능 | 구현 방법 | 기술 선택 이유)
### 정량적 성과 (표: 지표 | Before | After | 측정 방법)
### 문제해결 과정 (문제 → 원인 분석 → 해결·대안 비교 → 결과 → 배운 점)
### 협업·태도   (표: 태도 키워드 | 근거 장면)
### AI 활용과 검증 (입력 없으면 생략)
### 회고
### 코치 피드백 (보완하면 더 강해지는 점 3가지)`;
}

let sampleP=window.claude?.use?window.claude.use("sample"):Promise.resolve(null);
let busy=null;
$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  if(!$("name").value.trim()&&!$("myrole").value.trim()){$("st").textContent="프로젝트명이나 맡은 일 중 하나는 적어 주세요.";return}
  const sample=await sampleP;
  if(!sample){$("na").hidden=false;$("st").textContent="AI 생성 불가";return}
  busy?.abort();busy=new AbortController();
  $("go").disabled=true;$("st").textContent="작성 중…";
  try{
    const r=await sample(prompt(),{signal:busy.signal,modelTier:"default",cache:false,onText:({text})=>{md=text;render(md)}});
    md=r.text;render(md);$("st").textContent="완성 · 노션에 붙여넣으세요";
  }catch(err){
    if(err?.text){md=err.text;render(md)}
    $("st").textContent=err?.code==="rate_limited"?"요청이 많아요. 잠시 후 다시 눌러 주세요.":err?.code==="not_granted"?"AI 사용 권한이 허용되지 않았어요.":"생성에 실패했어요. 다시 눌러 주세요.";
  }finally{$("go").disabled=false}
});

$("copy").onclick=async()=>{
  try{await navigator.clipboard.writeText(md);$("st").textContent="복사했어요"}
  catch(e){const r=document.createRange();r.selectNodeContents($("doc"));const s=getSelection();s.removeAllRanges();s.addRange(r);$("st").textContent="선택됨 · Ctrl+C로 복사하세요"}
};
</script>
