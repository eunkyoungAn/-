<title>커리어캐쳐 질문 구조 연습</title>
<style>
/* 커리어캐쳐 질문 구조 연습: 면접 리허설과 같은 구성. 모바일 우선, 큰 글씨, 화면당 주요 버튼 하나 */
:root {
  --bg: #ffffff; --panel: #fff; --fg: #1b2235; --muted: #687089; --line: #e3e8f4;
  --accent: #2f5fe8; --accent-fg: #fff; --soft: #eaf0ff; --warn: #c2410c; --warn-soft: #fff1ea;
  --ok: #0f8a63; --focus: #fff8e1; --focus-line: #f2c14e; --amber: #8a5a00;
  --mint: #19c39a; --mint-soft: #e4f9f2; --navy: #1f2433; --band: #2f5fe8; --field: #f6f8ff;
  --shadow: 0 6px 20px rgba(47, 95, 232, .08);
  --font: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", "Noto Sans KR", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font);
  font-size: 17px; line-height: 1.65; letter-spacing: -0.01em; word-break: keep-all; overflow-wrap: anywhere;
}
button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
h1, h2, h3, p { margin: 0; }
.wrap { max-width: 620px; margin: 0 auto; padding: 8px 16px 48px; display: grid; gap: 14px; }
.wrap > * { min-width: 0; }

.top {
  position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center;
  gap: 8px; padding: 12px max(16px, env(safe-area-inset-left)); background: var(--panel);
  border-bottom: 1px solid var(--line); box-shadow: 0 1px 0 rgba(0,0,0,.02);
}
.brand { border: 0; background: none; padding: 4px 0; font-size: 16px; font-weight: 700; cursor: pointer; }
.brand b { color: var(--accent); font-weight: 800; }
.step { font-size: 14px; color: var(--muted); white-space: nowrap; }

.hero h1 { font-size: 27px; line-height: 1.35; margin: 18px 0 8px; font-weight: 800; letter-spacing: -0.04em; }
.hero p { color: var(--muted); }
.hero.small h1 { font-size: 23px; margin-top: 4px; }
.home-hero { text-align: center; padding: 14px 4px 2px; }
.home-hero h1 { font-size: 30px; line-height: 1.32; margin: 6px 0 10px; }
.home-hero p { font-size: 16px; }
.kicker { display: inline-block; padding: 4px 12px; border-radius: 999px; background: var(--soft); color: var(--accent) !important; font-size: 13px !important; font-weight: 800; }
.hl { color: var(--accent); background: linear-gradient(transparent 62%, var(--mint-soft) 62%); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats > div { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px 10px 12px; text-align: center; box-shadow: var(--shadow); }
.stats .badge { display: inline-block; font-size: 11px; font-weight: 800; color: #fff; background: var(--accent); border-radius: 6px; padding: 1px 6px; }
.stats .badge.mint { background: var(--mint); }
.stats b { display: block; font-size: 34px; font-weight: 900; line-height: 1.15; color: var(--accent); letter-spacing: -0.04em; margin-top: 6px; }
.stats b.mint { color: var(--mint); }
.stats b small { font-size: 15px; font-weight: 800; color: var(--fg); margin-left: 1px; }
.stats p { margin-top: 4px; font-size: 12.5px; color: var(--muted); line-height: 1.4; }

.flow { margin: 2px -16px; padding: 26px 12px 24px; background: var(--band); color: #fff; text-align: center; }
.flow h2 { margin-bottom: 18px; font-size: 21px; font-weight: 800; letter-spacing: -0.03em; }
.flow h2 span { color: #8ff0d2; }
.flow ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.flow li { position: relative; display: grid; justify-items: center; gap: 8px; }
.flow li + li::before { content: '›'; position: absolute; left: -9px; top: 15px; font-size: 20px; color: #ffffff99; }
.flow i { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: #fff; color: var(--band); box-shadow: 0 6px 16px rgba(0,0,0,.15); }
.flow svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.flow b { font-size: 12.5px; line-height: 1.35; font-weight: 800; }
.flow em { display: block; font-style: normal; color: #8ff0d2; font-size: 11.5px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 20px 18px; box-shadow: var(--shadow); }
.card h2 { margin-bottom: 10px; font-size: 19px; font-weight: 800; letter-spacing: -0.03em; }
.card h3 { margin: 14px 0 4px; font-size: 15px; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
ul.plain, ol.plain { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 16px; }
ol.plain li::marker { color: var(--accent); font-weight: 800; }
.notice { background: var(--soft); border-radius: 16px; padding: 14px 16px; font-size: 16px; }
.notice.mint { background: var(--mint-soft); box-shadow: inset 4px 0 0 var(--mint); }
.notice.warn { background: var(--warn-soft); box-shadow: inset 4px 0 0 var(--warn); }
.notice b.lab { display: block; font-size: 14px; color: var(--muted); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 18px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 700; text-align: center;
}
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); box-shadow: 0 8px 18px rgba(47, 95, 232, .25); }
.btn.big { min-height: 58px; font-size: 18px; width: 100%; }
.btn.sm { min-height: 40px; font-size: 15px; padding: 0 14px; }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.btn:focus-visible, .seg button:focus-visible, .qlist button:focus-visible, .brand:focus-visible { outline: 3px solid var(--focus-line); outline-offset: 2px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.row2 .btn { width: 100%; }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--soft); padding: 4px; border-radius: 999px; margin-bottom: 8px; }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.seg button { min-height: 46px; padding: 0 6px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-weight: 700; cursor: pointer; font-size: 16px; }
.seg button.on { background: var(--accent); color: var(--accent-fg); box-shadow: 0 6px 14px rgba(47, 95, 232, .25); }

.qlist { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.qlist button {
  width: 100%; text-align: left; display: flex; gap: 12px; align-items: flex-start; padding: 14px;
  border: 1px solid var(--line); border-radius: 16px; background: var(--panel); cursor: pointer; font-size: 17px; box-shadow: var(--shadow);
}
.qlist button:hover:not(:disabled) { outline: 2px solid var(--accent); outline-offset: -2px; }
.qlist button.sel { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--soft); }
.qlist button.right { outline: 2px solid var(--ok); outline-offset: -2px; background: var(--mint-soft); }
.qlist button.wrong { outline: 2px solid var(--warn); outline-offset: -2px; background: var(--warn-soft); }
.qlist button:disabled { cursor: default; box-shadow: none; }
.qlist .two { display: grid; gap: 2px; }
.qlist .two b { font-weight: 800; }
.qlist .two span { font-size: 14px; color: var(--muted); line-height: 1.45; }
.qn { flex: none; min-width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 700; display: grid; place-items: center; }
.qn.circ { background: var(--soft); color: var(--accent); font-size: 15px; }
.group { font-size: 15px; color: var(--muted); font-weight: 700; margin: 10px 0 6px; }

textarea { display: block; width: 100%; min-height: 96px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--field); font-size: 17px; line-height: 1.6; resize: vertical; }
textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }

.question { text-align: center; padding: 18px 4px 4px; }
.question h1 { font-size: 24px; line-height: 1.4; margin-top: 10px; font-weight: 800; letter-spacing: -0.04em; }
.qcat { display: inline-block; padding: 3px 12px; border-radius: 999px; background: var(--soft); color: var(--accent); font-weight: 800; font-size: 13px; }
.passage { background: var(--soft); border-radius: 14px; padding: 14px 16px; font-size: 16px; }

.timerbar { display: flex; align-items: center; gap: 12px; }
.timerbar .bar { flex: 1; height: 8px; background: var(--soft); border-radius: 4px; overflow: hidden; }
.timerbar .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--mint)); transition: width 1s linear; }
.timerbar.low .bar i { background: var(--warn); }
.tleft { font-size: 21px; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--accent); min-width: 58px; text-align: right; }
.timerbar.low .tleft { color: var(--warn); }
.verdict { font-weight: 800; padding: 11px 14px; border-radius: 12px; }
.verdict.ok { background: var(--mint-soft); color: var(--ok); }
.verdict.no { background: var(--warn-soft); color: var(--warn); }
.exp dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; }
.exp dt { font-weight: 800; color: var(--accent); white-space: nowrap; font-size: 15px; }
.exp dd { margin: 0; min-width: 0; font-size: 16px; }

.chat { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 88%; padding: 12px 14px; border-radius: 16px; white-space: pre-wrap; font-size: 16px; }
.msg.them { background: var(--soft); align-self: flex-start; border-top-left-radius: 4px; }
.msg.me { background: var(--accent); color: #fff; align-self: flex-end; border-top-right-radius: 4px; }
.who { display: block; font-size: 12px; font-weight: 700; opacity: .75; margin-bottom: 4px; }
.conds { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 4px; font-size: 15px; }

.total { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px; color: #fff; border-radius: 22px;
  background: linear-gradient(135deg, var(--accent), #4d7bff 60%, #3fc9b0); box-shadow: 0 12px 26px rgba(47, 95, 232, .25); }
.total p { font-size: 15px; opacity: .92; }
.total strong { display: block; font-size: 19px; line-height: 1.4; }
.tnum2 { flex: none; font-size: 44px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; }
.tnum2 small { font-size: 18px; font-weight: 800; opacity: .85; }

.scores { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.scores li { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.sl { display: grid; font-size: 16px; font-weight: 700; }
.sl .muted { font-size: 14px; line-height: 1.45; font-weight: 400; }
.lv { padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 800; white-space: nowrap; }
.lv.ok { background: var(--mint-soft); color: var(--ok); }
.lv.weak { background: var(--focus); color: var(--amber); }
.lv.no { background: var(--warn-soft); color: var(--warn); }

.checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 11px; }
.checks li { display: grid; grid-template-columns: 22px 1fr auto; gap: 9px; align-items: start; }
.checks .mk { font-weight: 900; text-align: center; }
.mk.y { color: var(--ok); } .mk.p { color: var(--amber); } .mk.n { color: var(--warn); }
.checks b { font-weight: 800; }
.checks .tip { display: block; font-size: 14px; color: var(--muted); line-height: 1.5; margin-top: 2px; }
.checks .pt { font-size: 14px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }

blockquote { margin: 0; padding: 10px 14px; border-left: 4px solid var(--mint); background: var(--mint-soft); border-radius: 0 10px 10px 0; white-space: pre-wrap; }
blockquote.before { border-left-color: var(--line); background: var(--field); color: var(--muted); }
.out { white-space: pre-wrap; margin: 0; padding: 14px; border-radius: 14px; background: var(--field); border: 1px solid var(--line); font: inherit; font-size: 16px; line-height: 1.7; }
.compare { display: grid; gap: 14px; }
.savebtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.disclaimer { font-size: 13px; color: var(--muted); text-align: center; }
.five { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.five li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; }
.five b { display: block; }
.five span { display: block; font-size: 15px; color: var(--muted); line-height: 1.5; }
details { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 12px; }
details summary { cursor: pointer; font-weight: 700; min-height: 36px; display: flex; align-items: center; }
details .msg { max-width: 100%; margin-top: 8px; }

#toast {
  position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
  max-width: calc(100% - 32px); width: max-content; padding: 12px 16px; border-radius: 999px;
  background: var(--navy); color: #fff; font-size: 15px; opacity: 0; pointer-events: none; transition: .2s; z-index: 10;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (min-width: 700px) {
  .wrap { max-width: 860px; }
  .compare { grid-template-columns: 1fr 1fr; }
  .flow { margin: 2px 0; border-radius: 24px; }
  .flow i { width: 64px; height: 64px; } .flow svg { width: 30px; height: 30px; }
  .flow li + li::before { top: 20px; }
  .home-hero h1 { font-size: 36px; }
}
@media (max-width: 380px) { .seg button { font-size: 14.5px; } .stats b { font-size: 30px; } }
@media (prefers-reduced-motion: reduce) { #toast, .timerbar .bar i { transition: none; } }
@media print { .no-print, #toast { display: none !important; } .card { box-shadow: none; } }
</style>

<div id="app"><noscript>이 연습 도구는 JavaScript가 켜져 있어야 동작합니다.</noscript></div>

<script>
/* 질문 구조 연습 — AI를 부르지 않고 정해진 규칙으로 동작한다.
   역할 · 자료 · 할 일 · 형식 · 조건 다섯 가지를 세 가지 방식으로 연습한다.
     1) 객관식: 상황을 읽고 네 지시문 가운데 가장 알맞은 것 고르기 (문항당 90초)
     2) 주관식: 동료의 부탁과 조건을 보고 지시문을 직접 타자로 쓰기 → 요소별 채점
     3) 내 지시문 다듬기: 내가 쓴 지시문을 점검하고 빠진 곳 채우기
   입력한 내용은 어디에도 보내지 않고, 화면을 닫으면 사라진다.
   내용을 바꾸려면 아래 THEMES(다듬기 보기), QUIZ(객관식), DRILL(주관식)만 고치면 된다. */
(function () {
  'use strict';

  var LIMIT = 90; // 객관식 한 문제 제한 시간(초)

  /* ---------- 다섯 가지 요소: 판별 규칙과 설명 ---------- */
  var ELEMENTS = [
    { key: 'role', name: '역할', desc: 'AI가 어떤 사람의 눈으로 답할지',
      has: /(너는|당신은|네 역할|역할[은을]|로서|입장에서|관점에서|의 눈으로|전문가(로|처럼)|처럼 (답|써|말))/,
      whyNo: 'AI가 누구의 눈으로 답할지 없습니다.', whyOk: '누구의 눈으로 답할지 적혀 있습니다.',
      q: 'AI가 어떤 사람의 눈으로 답하면 좋을까요?',
      blank: '[어떤 사람의 눈으로 답할지 적기]' },
    { key: 'data', name: '자료', desc: 'AI가 근거로 삼을 글 · 파일 · 재료',
      has: /(첨부|아래|붙여|붙인|다음 (자료|글|내용|표|문서)|자료|파일|링크|원문|본문|기사|보고서를|설문|통계|기준으로|바탕으로|참고해|참고하여|있는 재료|재료는|재료만|"""|```)/,
      whyNo: '무엇을 바탕으로 할지 없습니다. AI가 아는 대로 채울 수 있습니다.', whyOk: '바탕으로 삼을 자료가 적혀 있습니다.',
      q: 'AI가 바탕으로 삼을 자료나 재료가 있나요?',
      blank: '[바탕으로 삼을 자료나 재료 적기]' },
    { key: 'task', name: '할 일', desc: '무엇을 해 달라는지, 누가 어디에 쓰는지',
      has: /(써|쓰|작성|정리|요약|분석|비교|만들|찾아|검토|번역|추천|설명|알려|고쳐|다듬|뽑아|분류|기획|설계|평가|점검|제안|조사|짜\s?줘|짜\s?주|도와|해\s?줘|해\s?주|봐\s?줘|봐\s?주)/,
      detail: /(위해|위한|용으로|대상|에게|독자|읽는 사람|제출|보고용|발표|공유|회의|제안서|올릴|먹을|먹는다|가족|아이|손님|초보|팀장|광고주|고객사)/,
      whyNo: '무엇을 해 달라는지 보이지 않습니다.', whyWeak: '할 일은 있지만 누가 어디에 쓰는지 없습니다.', whyOk: '할 일과 쓰임이 적혀 있습니다.',
      q: '이 결과는 누가, 어디에 쓰나요?', qNo: '무엇을 해 달라고 할까요? 한 문장으로 적어 주세요.',
      blank: '[누가 어디에 쓰는지 적기]', blankNo: '[무엇을 해 달라는지 적기]' },

  /* ---------- 도구 ---------- */
  function stripEnd(v) { return String(v).trim().replace(/[.。\s]+$/, ''); }
  function endsWithBatchim(v) { // 마지막 글자에 받침이 있는지
    var c = v.charCodeAt(v.length - 1);
    return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0;
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function byKey(k) { for (var i = 0; i < ELEMENTS.length; i++) if (ELEMENTS[i].key === k) return ELEMENTS[i]; }
  function toast(msg) {
    var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }
  function josa(v, withB, withoutB) { return v + (endsWithBatchim(stripEnd(v)) ? withB : withoutB); } // 받침에 따라 조사 고르기
  var CIRC = ['①', '②', '③', '④'];
  function fmt(s) { s = Math.max(s, 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function tierOf(s) { return s >= 80 ? ['상', 'ok'] : s >= 50 ? ['중', 'weak'] : ['하', 'no']; }

  /* 직접 쓰기일 때 지시문 낱말로 주제를 짐작해 알맞은 보기를 낸다 */

    if (/(레시피|요리|반찬|메뉴|식단|도시락|간식|찌개|볶음|재료|저녁|점심|아침밥)/.test(text)) return 'recipe';
    if (/(마케팅|시장|경쟁사|트렌드|소비자|타깃|고객|브랜드|광고|캠페인|매출|SNS|인스타|여행|관광)/i.test(text)) return 'marketing';
    return 'free';

    var out = {};

      var has = E.has.test(text), state, why;
      if (E.key === 'data' && !has && text.length > 250 && /\n/.test(text)) has = true; // 긴 글을 붙여 넣은 경우
      if (E.key === 'task') {
        if (!has) { state = 'no'; why = E.whyNo; }
        else if (!E.detail.test(text)) { state = 'weak'; why = E.whyWeak; }
        else { state = 'ok'; why = E.whyOk; }
      } else if (E.key === 'format') {
        var size = E.detail.test(text);
        if (has && size) { state = 'ok'; why = E.whyOk; }
        else if (has) { state = 'weak'; why = E.whyWeak; }
        else if (size) { state = 'weak'; why = E.whyWeak2; }
        else { state = 'no'; why = E.whyNo; }
      } else { state = has ? 'ok' : 'no'; why = has ? E.whyOk : E.whyNo; }
      out[E.key] = { state: state, why: why };

        return { k: c.k, pt: c.pt, tip: c.tip, got: Math.round(c.pt * hit / c.re.length), hit: hit, of: c.re.length };
      }
      var ok = c.re.test(t);
      return { k: c.k, pt: c.pt, tip: c.tip, got: ok ? c.pt : 0, hit: ok ? 1 : 0, of: 1 };

        '<section class="notice mint"><b class="lab">다음 단계</b>이제 내 일에 써 봅니다. 지금 AI에게 보내려던 지시문을 넣으면 빠진 것을 짚고 채워 드립니다.</section>' +
        '<button class="btn primary big" data-act="go" data-v="input">내 지시문 다듬기</button>' +
        '<div class="row2"><button class="btn" data-act="startDrill">주관식 다시 풀기</button><button class="btn" data-act="home">처음으로</button></div></main>';
    },

    input: function () {
      var T = THEMES[S.theme];
      return top('다듬기 1 / 4 · 입력') + '<main class="wrap">' +
        '<section class="hero small"><h1>평소처럼 짧게 써 보세요</h1><p>지금 AI에게 보내려던 지시문을 그대로 넣어도 됩니다. 잘 쓰려고 하지 않아도 됩니다. 짧을수록 연습이 됩니다.</p></section>' +
        '<section class="card"><h2>내 지시문</h2><textarea id="prompt" rows="4" placeholder="' + esc(T.samples[0] || '예) 회의 내용 요약해 줘') + '" aria-label="내 지시문">' + esc(S.original) + '</textarea></section>' +
        '<section class="card"><h2>다듬는 방식</h2><div class="seg" role="radiogroup" aria-label="다듬는 방식">' +
        '<button role="radio" aria-checked="' + (S.mode === 'ask') + '" class="' + (S.mode === 'ask' ? 'on' : '') + '" data-act="mode" data-v="ask">질문 받으며</button>' +
        '<button role="radio" aria-checked="' + (S.mode === 'direct') + '" class="' + (S.mode === 'direct' ? 'on' : '') + '" data-act="mode" data-v="direct">바로 다듬기</button></div>' +
        '<p class="muted small">' + (S.mode === 'ask' ? '빠진 부분을 하나씩 물어봅니다. 보기를 고르거나 직접 적어 채웁니다.' : '빠진 부분을 빈칸 [ ]으로 넣은 틀을 바로 받습니다.') + '</p></section>' +
        (T.samples.length ? '<section><p class="group">예시로 시작하기 · ' + T.label + '</p><ul class="qlist">' +
          T.samples.map(function (s, i) { return '<li><button data-act="sample" data-v="' + esc(s) + '"><span class="qn">' + (i + 1) + '</span><span>' + esc(s) + '</span></button></li>'; }).join('') + '</ul></section>' : '') +
        '<button class="btn primary big" data-act="check">점검하기</button>' +
        '<button class="btn" data-act="home">처음으로</button></main>';
    },

    diag: function () {
      var d = S.diag, n = countOk(d), miss = 5 - n;
      return top('다듬기 2 / 4 · 점검') + '<main class="wrap">' +
        '<section class="total"><div><p>다섯 가지 가운데</p><strong>' + (miss ? miss + '가지를 더 채우면 됩니다' : '모두 갖춰져 있습니다') + '</strong></div><div class="tnum2">' + n + '<small> / 5</small></div></section>' +
        '<section class="card"><h2>넣은 지시문</h2><blockquote class="before">' + esc(S.original) + '</blockquote></section>' +
        '<section class="card"><h2>구조 점검</h2><ul class="scores">' + ELEMENTS.map(function (E) {
          var r = d[E.key];
          return '<li><div class="sl">' + E.name + '<span class="muted">' + r.why + '</span></div><span class="lv ' + r.state + '">' + (r.state === 'ok' ? '있음' : r.state === 'weak' ? '보완' : '없음') + '</span></li>';
        }).join('') + '</ul></section>' +
        (miss ? '<button class="btn primary big" data-act="start">' + (S.mode === 'ask' ? '빠진 것 채우기' : '빈칸 틀 받기') + '</button>'
              : '<section class="notice mint"><b class="lab">이대로 보내도 좋습니다</b>보내기 전에 분량과 조건이 원하는 만큼 구체적인지만 한 번 더 읽어 봅니다.</section><button class="btn primary big" data-act="copyOriginal">지시문 복사</button>') +
        '<button class="btn" data-act="go" data-v="input">지시문 고쳐 쓰기</button></main>';
    },

    ask: function () {
      var key = S.queue[0], E = byKey(key), noTask = key === 'task' && S.diag.task.state === 'no';
      var P = THEMES[S.usedTheme].picks, picks = noTask ? P.taskNo : P[key];
      var idx = S.total - S.queue.length + 1;
      return top('다듬기 3 / 4 · 채우기') + '<main class="wrap">' +
        '<section class="question"><span class="qcat">질문 ' + idx + ' / ' + S.total + ' · ' + E.name + '</span><h1>' + (noTask ? E.qNo : E.q) + '</h1></section>' +
        '<section><p class="group">보기에서 고르기</p><ul class="qlist">' +
        picks.map(function (p, i) { return '<li><button data-act="pick" data-v="' + esc(p) + '"><span class="qn">' + (i + 1) + '</span><span>' + esc(p) + '</span></button></li>'; }).join('') + '</ul></section>' +
        '<section class="card"><h2>직접 적기</h2><textarea id="answer" rows="2" placeholder="내 상황에 맞게 적어 보세요" aria-label="직접 적기"></textarea>' +
        '<div class="savebtns"><button class="btn" data-act="skip">건너뛰기</button><button class="btn primary" data-act="answer">이 답으로</button></div></section>' +
        (S.queue.length > 1 ? '<button class="btn" data-act="finish">여기까지만 하고 완성하기</button>' : '') + '</main>';
    },

    result: function () {
      var d = S.diag, a = S.answers, direct = S.mode === 'direct';
      var after = ELEMENTS.filter(function (E) { return d[E.key].state === 'ok' || a[E.key]; }).length;
      var left = ELEMENTS.filter(function (E) { return d[E.key].state !== 'ok' && !a[E.key]; }).map(function (E) { return E.name; });
      return top('다듬기 4 / 4 · 완성') + '<main class="wrap">' +
        (direct
          ? '<section class="total"><div><p>빈칸 틀이 나왔습니다</p><strong>대괄호 [ ] 안을 내 상황에 맞게 고쳐 씁니다</strong></div><div class="tnum2">' + left.length + '<small> 칸</small></div></section>'
          : '<section class="total"><div><p>처음 ' + countOk(d) + '가지에서</p><strong>' + (left.length ? '아직 비어 있는 것: ' + left.join(', ') : '다섯 가지를 모두 채웠습니다') + '</strong></div><div class="tnum2">' + after + '<small> / 5</small></div></section>') +
        '<section class="card"><h2>다듬은 지시문</h2>' +
        (direct ? '<textarea id="edit" rows="14" aria-label="다듬은 지시문 고쳐 쓰기">' + esc(S.result) + '</textarea><p class="muted small">이 칸에서 바로 고쳐 쓸 수 있습니다. 쓰지 않을 칸은 제목 줄까지 지웁니다. 빈칸을 그대로 보내면 AI가 대괄호 문구를 지시로 읽습니다.</p>'
                : '<pre class="out" id="out">' + esc(S.result) + '</pre>') +
        '<div class="savebtns no-print"><button class="btn primary" data-act="copy">복사</button><button class="btn" data-act="save">글 파일로 저장</button></div></section>' +
        '<section class="card"><h2>처음과 비교</h2><div class="compare"><div><h3>처음 지시문</h3><blockquote class="before">' + esc(S.original) + '</blockquote></div>' +
        '<div><h3>달라진 점</h3><ul class="plain">' + ELEMENTS.filter(function (E) { return d[E.key].state !== 'ok'; }).map(function (E) {
          return '<li><b>' + E.name + '</b> ' + (a[E.key] ? '채움' : direct ? '빈칸으로 남김' : '건너뜀') + '</li>'; }).join('') + '</ul></div></div></section>' +
        '<section class="notice mint"><b class="lab">다음에 할 일</b>복사한 지시문을 쓰는 AI(Claude, ChatGPT, 제미나이 등)에 한 번만 보냅니다. 자료를 붙이기로 했다면 지시문 아래에 자료를 함께 붙여 넣습니다.</section>' +
        (direct ? '<button class="btn primary big no-print" data-act="toAsk">같은 지시문을 질문 받으며 다듬기</button>' : '') +
        '<div class="row2 no-print"><button class="btn" data-act="again">다른 지시문 연습</button><button class="btn" data-act="home">처음으로</button></div></main>';
    },

    five: function () {
      return top('') + '<main class="wrap"><section class="hero small"><h1>지시문의 다섯 가지</h1><p>AI는 적힌 만큼만 압니다. 다섯 가지를 적어 주면 다시 묻고 고치는 일이 줄어듭니다.</p></section>' +
        '<section class="card">' + fiveList() + '</section>' +
        '<section class="card"><h2>레시피로 보면</h2><div class="compare"><div><h3>처음</h3><blockquote class="before">김치찌개 레시피 알려줘</blockquote></div><div><h3>다듬은 뒤</h3><blockquote>' +
        esc('# 역할\n너는 요리 초보를 가르치는 요리 강사다.\n\n# 자료\n집에 있는 재료만 쓴다: 두부, 달걀, 대파, 김치.\n\n# 할 일\n김치찌개 레시피를 알려 줘.\n쓰임: 요리 초보인 내가 오늘 저녁에 만든다.\n\n# 형식\n재료 표 하나와 조리 순서 번호 목록 6단계 이내.\n\n# 조건\n조리 시간은 30분 이내로 한다.') + '</blockquote></div></div></section>' +
        '<section class="card"><h2>마케팅 자료조사로 보면</h2><div class="compare"><div><h3>처음</h3><blockquote class="before">요즘 20대 소비 트렌드 조사해 줘</blockquote></div><div><h3>다듬은 뒤</h3><blockquote>' +
        esc('# 역할\n너는 소비재 브랜드의 마케팅 리서처다.\n\n# 자료\n아래에 붙여 넣는 기사와 보고서만 근거로 쓴다.\n\n# 할 일\n요즘 20대 소비 트렌드를 조사해 줘.\n쓰임: 광고주 제안서의 시장 현황 부분에 넣는다.\n\n# 형식\n핵심 발견 5개 번호 목록, 각 2줄 이내.\n\n# 조건\n수치마다 출처와 기준 연도를 붙인다.') + '</blockquote></div></div></section>' +
        '<button class="btn primary big" data-act="home">연습 고르러 가기</button></main>';
    },

    guide: function () {
      return top('') + '<main class="wrap"><section class="hero small"><h1>이용 방법</h1><p>세 가지 연습이 있습니다. 순서대로 하면 15분쯤 걸립니다.</p></section>' +
        '<section class="card"><h2>연습 순서</h2><ol class="plain">' +
        '<li><b>객관식</b> — 상황을 읽고 네 지시문 가운데 가장 알맞은 것을 고릅니다. 문항당 90초, 시간이 끝나면 해설이 열립니다.</li>' +
        '<li><b>주관식</b> — 동료의 부탁과 조건을 보고 지시문을 직접 씁니다. 다섯 가지 요소로 100점을 매기고 빠진 것을 알려 줍니다.</li>' +
        '<li><b>내 지시문 다듬기</b> — 지금 쓰려던 지시문을 넣어 점검하고 채웁니다.</li></ol></section>' +
        '<section class="card"><h2>알아 둘 점</h2><ul class="plain">' +
        '<li>이 화면은 AI가 아닙니다. 낱말을 보고 판별하므로 뜻이 같아도 다르게 적으면 못 알아볼 수 있습니다. 점수보다 빠진 항목을 보세요.</li>' +
        '<li>객관식 정답과 주관식 모범 예시는 하나의 보기일 뿐, 그 문장만 정답인 것은 아닙니다.</li>' +
        '<li>입력한 내용은 저장하지 않습니다. 남기려면 다듬기 결과에서 "글 파일로 저장"을 누릅니다.</li>' +
        '<li>문항 상황과 인물은 교육용 가상 설정입니다.</li></ul></section>' +
        '<button class="btn primary big" data-act="home">연습 고르러 가기</button></main>';
    }
  };

  function render(view) {
    if (view) S.view = view;
    clearInterval(S.timer); S.timer = null;
    app.innerHTML = VIEWS[S.view]();
    if (S.view === 'quiz' && !S.qShown) startTimer();
    window.scrollTo(0, 0);
  }

  function startTimer() {
    S.timer = setInterval(function () {
      S.qLeft--;
      var tl = document.getElementById('tleft'), tb = document.getElementById('tbar'), box = document.getElementById('tb');
      if (!tl) { clearInterval(S.timer); return; }
      tl.textContent = fmt(S.qLeft);
      tb.style.width = Math.max(S.qLeft, 0) / LIMIT * 100 + '%';
      box.classList.toggle('low', S.qLeft <= 15);
      if (S.qLeft <= 0) { clearInterval(S.timer); reveal(); }
    }, 1000);
  }

  /* ---------- 흐름 ---------- */
  function startQuiz() { S.qi = 0; S.qScore = 0; S.qPick = null; S.qShown = false; S.qLeft = LIMIT; render('quiz'); }
  function reveal() {
    if (S.qShown) return;
    S.qShown = true; clearInterval(S.timer);
    if (S.qPick === QUIZ[S.theme][S.qi].ans) S.qScore++;
    render();
  }
  function nextQuiz() {
    if (S.qi === QUIZ[S.theme].length - 1) { render('quizEnd'); return; }
    S.qi++; S.qPick = null; S.qShown = false; S.qLeft = LIMIT; render();
  }

  function startDrill() { S.drills = DRILL[S.theme]; S.di = 0; S.dScores = []; S.dGraded = null; S.dText = ''; render('drill'); }
  function sendDrill() {
    var el = document.getElementById('pr'), text = el ? el.value.trim() : '';
    if (text.length < 5) { toast('지시문을 조금 더 적어 주세요.'); return; }
    S.dText = text;
    S.dGraded = gradeDrill(S.drills[S.di], text);
    var score = S.dGraded.reduce(function (a, c) { return a + c.got; }, 0);
    S.dScores[S.di] = { score: score, miss: S.dGraded.filter(function (c) { return c.got < c.pt; }).map(function (c) { return c.k; }) };
    render();
  }
  function nextDrill() {
    if (S.di === S.drills.length - 1) { render('drillEnd'); return; }
    S.di++; S.dGraded = null; S.dText = ''; render();
  }

  function check(text) {
    text = String(text || '').trim();
    if (text.length < 4) { toast('지시문을 조금 더 길게 적어 주세요.'); return; }
    S.original = text; S.diag = diagnose(text); S.answers = {};
    var g = guessTheme(text);
    S.usedTheme = g === 'free' ? S.theme : g;
    render('diag');
  }
  function start() {
    S.answers = {};
    if (S.mode === 'direct') { S.result = build(S.original, S.diag, {}, true); render('result'); return; }
    S.queue = ELEMENTS.filter(function (E) { return S.diag[E.key].state !== 'ok'; }).map(function (E) { return E.key; });
    S.total = S.queue.length;
    render('ask');
  }
  function answer(v) {
    var key = S.queue.shift();
    if (v) S.answers[key] = v;
    if (S.queue.length) render('ask'); else finish();
  }
  function finish() { S.queue = []; S.result = build(S.original, S.diag, S.answers, false); render('result'); }
  function currentResult() { var e = document.getElementById('edit'); return e ? e.value : S.result; }

  function copyText(text) {
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      toast(ok ? '복사했습니다. 쓰는 AI에 붙여 넣으세요.' : '복사가 막혀 있습니다. 글을 길게 눌러 직접 복사해 주세요.');
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { toast('복사했습니다. 쓰는 AI에 붙여 넣으세요.'); }, fallback);
    else fallback();
  }
  function saveText(text) {
    var body = '[처음 지시문]\r\n' + S.original + '\r\n\r\n[다듬은 지시문]\r\n' + text.replace(/\n/g, '\r\n') + '\r\n';
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + body], { type: 'text/plain;charset=utf-8' }));
    a.download = '다듬은_지시문.txt'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast('글 파일로 저장했습니다.');
  }

  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.getAttribute('data-act'), v = b.getAttribute('data-v');
    if (act === 'home') render('home');
    else if (act === 'go') render(v);
    else if (act === 'theme') { S.theme = v; S.original = ''; render(); }
    else if (act === 'mode') { S.mode = v; render(); }
    else if (act === 'startQuiz') startQuiz();
    else if (act === 'pickOpt') { S.qPick = +v; render(); }
    else if (act === 'reveal') reveal();
    else if (act === 'nextQuiz') nextQuiz();
    else if (act === 'startDrill') startDrill();
    else if (act === 'sendDrill') sendDrill();
    else if (act === 'hint') { var h = document.getElementById('pr'); if (h && !h.value.trim()) { h.value = '너는 '; h.focus(); } toast('다섯 가지: 역할 · 자료 · 할 일 · 형식 · 조건'); }
    else if (act === 'retryDrill') { S.dGraded = null; render(); }
    else if (act === 'nextDrill') nextDrill();
    else if (act === 'sample') check(v);
    else if (act === 'check') check(document.getElementById('prompt').value);
    else if (act === 'start') start();
    else if (act === 'pick') answer(v);
    else if (act === 'answer') { var t = document.getElementById('answer').value.trim(); if (!t) { toast('답을 적거나 보기를 골라 주세요.'); return; } answer(t); }
    else if (act === 'skip') answer(null);
    else if (act === 'finish') finish();
    else if (act === 'copy') copyText(currentResult());
    else if (act === 'copyOriginal') copyText(S.original);
    else if (act === 'save') saveText(currentResult());
    else if (act === 'toAsk') { S.mode = 'ask'; start(); }
    else if (act === 'again') { S.original = ''; render('input'); }
  });

  render('home');
})();
</script>
</body></html>
