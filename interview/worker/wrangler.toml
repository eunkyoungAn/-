# 면접 리허설 AI 평가 중계 서버
# 비밀값은 파일에 쓰지 말고 아래 명령으로 넣는다.
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put CLASS_CODE     (수업 코드, 참여자 배포 링크에 들어감)
name = "careercatcher-interview"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# 면접 연습 화면이 열리는 사이트 주소(쉼표로 여러 개)
ALLOWED_ORIGINS = "https://eunkyoungan.github.io"
# low | medium | high. 수업 중 대기 시간을 줄이려고 low가 기본
EFFORT = "low"
