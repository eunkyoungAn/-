<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무 에이전트 스튜디오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1C64F2; --blue-d:#1E3A8A; --blue-l:#EBF2FF;
  --bg:#F7F8FA; --card:#FFFFFF; --line:#E5E7EB; --line-s:#F0F1F3;
  --t1:#101828; --t2:#475467; --t3:#98A2B3;
  --green:#039855; --green-l:#ECFDF3; --amber:#B54708; --amber-l:#FFFAEB;
  --purple:#6938EF; --purple-l:#F4F3FF; --teal:#0E7490; --teal-l:#ECFEFF;
  --red:#B42318; --red-l:#FEF3F2;
}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--t1);
  font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}

/* ---------- Sidebar ---------- */
.side{width:252px;flex:0 0 252px;background:var(--card);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.ws{padding:20px 18px 16px;border-bottom:1px solid var(--line-s)}
.ws-badge{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:500;
  color:var(--blue-d);background:var(--blue-l);padding:4px 9px;border-radius:5px;letter-spacing:.02em}
.ws h1{font-size:15px;font-weight:700;margin-top:11px;letter-spacing:-.01em}
.ws p{font-size:11.5px;color:var(--t3);margin-top:3px}
.nav{padding:14px 10px;flex:1}
.nav-h{font-size:10.5px;font-weight:700;color:var(--t3);letter-spacing:.07em;
  padding:0 8px 8px;text-transform:uppercase}
.item{display:flex;gap:10px;align-items:flex-start;padding:9px 9px;border-radius:7px;
  cursor:pointer;border:1px solid transparent;transition:background .12s}
.item:hover{background:var(--bg)}
.item.on{background:var(--blue-l);border-color:#D3E2FF}
.ic{width:26px;height:26px;flex:0 0 26px;border-radius:6px;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:#fff;margin-top:1px}
.item-b{min-width:0;flex:1}
.item-n{font-size:12.8px;font-weight:500;line-height:1.4;letter-spacing:-.01em}
.item.on .item-n{color:var(--blue-d);font-weight:700}
.item-t{font-size:10.5px;color:var(--t3);margin-top:2px}
.side-f{padding:14px 18px;border-top:1px solid var(--line-s);font-size:10.5px;color:var(--t3);line-height:1.6}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:18px 28px 0;position:sticky;top:0;z-index:5}
.top-r{display:flex;align-items:flex-start;gap:13px}
.top-ic{width:38px;height:38px;flex:0 0 38px;border-radius:9px;display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:14px}
.top-m{flex:1;min-width:0}
.top-m h2{font-size:18px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:500;padding:3px 8px;border-radius:5px;letter-spacing:.01em}
.tag.wf{background:var(--purple-l);color:var(--purple)}
.tag.ag{background:var(--teal-l);color:var(--teal)}
.tag.cf{background:var(--green-l);color:var(--green)}
.top-m p{font-size:12.5px;color:var(--t2);margin-top:5px;max-width:720px}
.src{font-size:11px;color:var(--t3);margin-top:7px}
.src b{color:var(--blue-d);font-weight:500}
.tabs{display:flex;gap:2px;margin-top:17px}
.tab{padding:9px 15px;font-size:13px;font-weight:500;color:var(--t2);cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--t1)}
.tab.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.body{padding:24px 28px 56px;max-width:1040px;width:100%}

/* ---------- Cards / form ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
.card-h{font-size:13.5px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card-s{font-size:11.5px;color:var(--t3);margin-bottom:16px;line-height:1.6}
.fld{margin-bottom:15px}
.fld:last-child{margin-bottom:0}
label{display:block;font-size:12px;font-weight:500;margin-bottom:6px}
label .req{color:var(--red);margin-left:3px}
.hint{font-size:11px;color:var(--t3);font-weight:400;margin-top:5px;line-height:1.55}
input[type=text],textarea,select{width:100%;padding:9px 11px;border:1px solid var(--line);
  border-radius:7px;font-family:inherit;font-size:13px;color:var(--t1);background:var(--card);line-height:1.6}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(28,100,242,.1)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:7px 13px;border:1px solid var(--line);border-radius:18px;font-size:12.5px;
  cursor:pointer;background:var(--card);transition:all .12s}
.chip:hover{border-color:#C9D2E0}
.chip.on{background:var(--blue-l);border-color:var(--blue);color:var(--blue-d);font-weight:500}

/* ---------- File drop ---------- */
.drop{border:1.5px dashed var(--line);border-radius:9px;padding:19px;text-align:center;cursor:pointer;
  background:#FCFCFD;transition:all .14s}
.drop{position:relative;display:block;margin:0;font-weight:400}
.fin{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.file.bad{background:var(--red-l);border-color:#FDA29B;align-items:flex-start}
.file.bad .file-n{white-space:normal}
.file-e{font-size:11px;font-weight:400;color:var(--red);margin-top:3px;line-height:1.55;white-space:normal}
.drop:hover,.drop.over{border-color:var(--blue);background:var(--blue-l)}
.drop-t{font-size:12.5px;font-weight:500}
.drop-s{font-size:11px;color:var(--t3);margin-top:4px}
.files{margin-top:11px;display:flex;flex-direction:column;gap:7px}
.file{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--bg);
  border:1px solid var(--line-s);border-radius:7px;font-size:12px}
.file-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.file-m{font-size:10.5px;color:var(--t3);flex:0 0 auto}
.x{cursor:pointer;color:var(--t3);font-size:15px;line-height:1;padding:2px 4px;flex:0 0 auto}
.x:hover{color:var(--red)}
.warn{margin-top:11px;padding:12px 14px;background:var(--red-l);border:1px solid #FDA29B;
  border-radius:8px;font-size:11.5px;line-height:1.65}
.warn b{color:var(--red);display:block;margin-bottom:5px;font-size:12px}
.warn-a{margin-top:9px;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Buttons ---------- */
.btn{padding:10px 19px;border:none;border-radius:7px;font-family:inherit;font-size:13px;
  font-weight:500;cursor:pointer;background:var(--blue);color:#fff;transition:background .12s}
.btn:hover{background:#1750CF}
.btn:disabled{background:#C9D2E0;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:11.5px}
.btn.gh{background:var(--card);color:var(--t2);border:1px solid var(--line)}
.btn.gh:hover{background:var(--bg);color:var(--t1)}
.run{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:4px}
.run-n{font-size:11px;color:var(--t3);flex:1;min-width:170px;line-height:1.55}

/* ---------- Node canvas ---------- */
.canvas{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px 22px;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:17px 17px;background-position:-1px -1px}
.flow{display:flex;flex-direction:column;align-items:center;gap:0}
.node{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:13px 15px;
  width:100%;max-width:430px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.node.hl{border-color:var(--blue);box-shadow:0 0 0 3px rgba(28,100,242,.09)}
.node-t{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.ntype{font-size:9.5px;font-weight:700;padding:2.5px 7px;border-radius:4px;letter-spacing:.04em}
.nt-start{background:var(--green-l);color:var(--green)}
.nt-llm{background:var(--purple-l);color:var(--purple)}
.nt-code{background:var(--teal-l);color:var(--teal)}
.nt-know{background:#FDF2FA;color:#C11574}
.nt-if{background:var(--amber-l);color:var(--amber)}
.nt-human{background:var(--red-l);color:var(--red)}
.nt-tpl{background:#F2F4F7;color:var(--t2)}
.nt-end{background:#F2F4F7;color:var(--t2)}
.node-n{font-size:13px;font-weight:700;letter-spacing:-.01em}
.node-d{font-size:11.5px;color:var(--t2);line-height:1.6}
.node-r{font-size:11px;color:var(--amber);background:var(--amber-l);padding:6px 9px;
  border-radius:5px;margin-top:8px;line-height:1.55}
.arrow{width:2px;height:20px;background:var(--line);position:relative}
.arrow::after{content:'';position:absolute;bottom:-1px;left:-3.5px;width:0;height:0;
  border-left:4.5px solid transparent;border-right:4.5px solid transparent;border-top:6px solid var(--line)}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line-s);
  font-size:10.5px;color:var(--t2)}
.legend span{display:flex;align-items:center;gap:5px}

/* ---------- Output ---------- */
.out{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
.out-h{padding:13px 18px;border-bottom:1px solid var(--line-s);display:flex;align-items:center;
  gap:10px;background:#FCFCFD}
.out-h h3{font-size:12.5px;font-weight:700;flex:1}
.out-b{padding:20px 22px;font-size:13.5px;line-height:1.85;max-height:640px;overflow-y:auto}
.dot{width:6px;height:6px;border-radius:50%;background:var(--blue);animation:p 1.3s infinite}
@keyframes p{0%,100%{opacity:.3}50%{opacity:1}}
.pre{background:#F9FAFB;border:1px solid var(--line);border-radius:8px;padding:16px;
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:11.5px;line-height:1.75;
  white-space:pre-wrap;word-break:break-word;max-height:580px;overflow-y:auto;color:#1D2939}

/* markdown */
.md h1,.md h2,.md h3,.md h4{font-weight:700;margin:20px 0 9px;letter-spacing:-.01em;line-height:1.4}
.md h1{font-size:17px}.md h2{font-size:15.5px}.md h3{font-size:14px}.md h4{font-size:13.5px}
.md h1:first-child,.md h2:first-child,.md h3:first-child{margin-top:0}
.md p{margin:9px 0}
.md ul,.md ol{margin:9px 0 9px 21px}
.md li{margin:4px 0}
.md strong{font-weight:700}
.md table{border-collapse:collapse;width:100%;margin:13px 0;font-size:12px}
.md th,.md td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.md th{background:var(--bg);font-weight:700;font-size:11.5px}
.md code{background:var(--bg);padding:1.5px 5px;border-radius:4px;font-size:12px;
  font-family:ui-monospace,Menlo,monospace}
.md hr{border:none;border-top:1px solid var(--line);margin:17px 0}
.md blockquote{border-left:3px solid var(--line);padding-left:13px;color:var(--t2);margin:11px 0}

/* rules list */
.rules{display:flex;flex-direction:column;gap:9px}
.rule{display:flex;gap:11px;padding:12px 14px;background:#FCFCFD;border:1px solid var(--line-s);border-radius:8px}
.rule-n{font-size:10.5px;font-weight:700;color:var(--blue);flex:0 0 20px;margin-top:2px}
.rule-b{font-size:12.5px;line-height:1.7;flex:1}
.rule-b b{font-weight:700}
.rule-b code{background:var(--blue-l);color:var(--blue-d);padding:1.5px 6px;border-radius:4px;
  font-size:11.5px;font-family:ui-monospace,Menlo,monospace}
.filebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.filebar .fb-t{font-size:12.5px;color:var(--t2);flex:1 1 220px;line-height:1.55}
.filebar .fb-t b{color:var(--t1)}
.note{padding:13px 15px;background:var(--amber-l);border:1px solid #FEDF89;border-radius:8px;
  font-size:12px;line-height:1.7;margin-bottom:16px}
.note b{color:var(--amber)}
.ok{padding:13px 15px;background:var(--green-l);border:1px solid #A6F4C5;border-radius:8px;
  font-size:12px;line-height:1.7;margin-bottom:16px}
.ok b{color:var(--green)}
.steps{display:flex;flex-wrap:wrap;gap:6px 4px;align-items:center}
.step{display:flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;font-size:11.5px;color:var(--t3);background:var(--card)}
.step .ntype{opacity:.45}
.step.done{color:var(--t2);background:var(--bg)}
.step.done .ntype{opacity:1}
.step.act{color:var(--blue-d);border-color:var(--blue);background:var(--blue-l);font-weight:700;box-shadow:0 0 0 3px rgba(28,100,242,.09)}
.step.act .ntype{opacity:1}
.step-a{color:var(--t3);font-size:12px}
.hide{display:none !important}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{width:100%;flex:none;height:auto;position:static;border-right:none;border-bottom:1px solid var(--line)}
  .nav{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .nav-h{grid-column:1/-1}
  .side-f{display:none}
  .top,.body{padding-left:16px;padding-right:16px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="ws">
      <div class="ws-badge">WORKSPACE</div>
      <h1 id="wsName">업무 에이전트 스튜디오</h1>
      <p id="wsSub">공공·교육기관 실무</p>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-h">에이전트 7</div>
    </nav>
    <div class="side-f" id="sideF">
      에이전트를 고르고, 값을 넣고, 자료를 올린 뒤 실행하면 이 화면에서 결과가 나옴.
      결과는 한글 · 워드 · PDF 가운데 골라 파일로 받음.<br><br>
      마지막 확인은 사람이 함.<br><br>커리어캐쳐 업무 에이전트 실습</div>
  </aside>

  <main class="main">
    <div class="top">
      <div class="top-r">
        <div class="top-ic" id="topIc">R</div>
        <div class="top-m">
          <h2><span id="topName">—</span><span class="tag" id="topTag">—</span></h2>
          <p id="topDesc">—</p>
          <div class="src" id="topSrc"></div>
        </div>
      </div>
      <div class="tabs">
        <div class="tab on" data-tab="run">실행</div>
        <div class="tab" data-tab="flow">노드 흐름</div>
        <div class="tab" data-tab="rules">공통 지침</div>
      </div>
    </div>
    <div class="body">
      <div id="paneRun"></div>
      <div id="paneFlow" class="hide"></div>
      <div id="paneRules" class="hide"></div>
    </div>
  </main>
</div>

<script>
/* ============================================================
   내 업무 정보 — CLAUDE.md 0번의 값을 여기에만 넣는다.
   이 블록 밖의 코드는 고치지 않는다. 비워 두면 기본값으로 동작한다.
   ============================================================ */
const CONFIG = {
  siteName: '',     // 화면 이름. 예: '○○센터 업무 도우미'
  org: '',          // 기관명
  role: '',         // 내 역할. 예: '직업교육 운영 담당'
  reader: '',       // 결과물을 받아 보는 사람
  rules: '',        // 우리 기관 문서 규칙
  banned: '',       // 쓰지 않는 표현
  humanCheck: '',   // 사람이 반드시 확인해야 하는 일
  accent: '',       // 강조색. 예: '#1C64F2'
  modelTier: ''     // 비워 두면 'default'. 더 꼼꼼하게(느림) 하려면 'complex'
};

/* ============================================================
   공통 지침 — 기존 지침.md 의 작성 규칙
   ============================================================ */
const COMMON_BASE = `[공통 작성 규칙 — 모든 에이전트에 적용]
- 근거: 제공된 자료만 사용함. 자료에 없는 수치·출처는 만들지 않음.
- 가상 자료는 결과물에 "교육·실습용 가상 자료"임을 밝힘.
- 외부 수치는 발표 기관·자료명·발행일이 있을 때만 사용함. 없으면 [자료 필요]로 표시함.
- 수치는 직접 계산하고 계산 기준(기준 인원: 몇 명 중인지)을 함께 적음.
- 비율의 기준 인원이 30명(건) 미만이면 "해석 주의"를 붙임. 모든 집단이 같은 인원이면 결과물 아래에 한 번만 적음.
- 상관을 원인으로 단정하지 않음. 원인 추정은 [확인 필요]로 표시함.
- 두 요인이 섞여 있으면 "이 자료로는 구분할 수 없음"이라고 적음.
- 문체: 개조식 업무보고(~함, ~임). 핵심 결론을 앞에 둠. 이모지를 쓰지 않음.
- 사실 · 분석 · 제안을 구분함. 가정은 [가정], 제안 문장은 앞에 (제안)을 붙임.
- 결과물 마지막에 수치 대조표(문장 | 수치 | 근거 위치 | 일치)를 붙임.
- 확인이 필요한 항목은 본문에 섞지 않고 끝에 따로 모아 제시함.
- 마지막 확인은 사람이 함. 사람이 확인해야 할 지점을 명시함.
- 지시문에 [N단계 — 이름]이 있으면, 각 단계의 결과를 "## [N단계 — 이름]" 제목 줄로 시작함. 단계를 건너뛸 때도 제목 줄과 "해당 없음" 한 줄을 적음.
- 인사말, 지시문 되풀이, "이어서 진행하겠습니다" 같은 진행 안내는 쓰지 않음. 결과만 냄.`;
const COMMON = COMMON_BASE + ((CONFIG.org||CONFIG.role||CONFIG.reader||CONFIG.rules||CONFIG.banned||CONFIG.humanCheck) ? `

[우리 기관 정보 — 이 값이 있으면 따름]` +
  (CONFIG.org ? `\n- 기관명: ${CONFIG.org}` : '') + (CONFIG.role ? `\n- 담당자 역할: ${CONFIG.role}` : '') +
  (CONFIG.reader ? `\n- 결과물을 받아 보는 사람: ${CONFIG.reader}` : '') + (CONFIG.rules ? `\n- 문서 규칙: ${CONFIG.rules}` : '') +
  (CONFIG.banned ? `\n- 쓰지 않는 표현: ${CONFIG.banned}` : '') + (CONFIG.humanCheck ? `\n- 사람이 반드시 확인할 일(결과 끝에 따로 표시): ${CONFIG.humanCheck}` : '') : '');

function stepHit(m, text){
  return /^\d+(-\d+)?단계$/.test(m) ? new RegExp('(^|\\n)[\\s#*\\[]*' + m + '(?![\\d-])').test(text) : text.indexOf(m) >= 0;
}
function stepBar(a){
  return '<div class="steps" id="steps">' + a.nodes.map((n,i)=>{
    const [cls,lab] = NT[n[0]]||NT.llm;
    return `<div class="step" data-i="${i}"><span class="ntype ${cls}">${lab}</span><span class="step-n">${esc(n[1])}</span></div>`;
  }).join('<span class="step-a">›</span>') + '</div>';
}
function stepUpdate(a, text, fin){
  const els = document.querySelectorAll('#steps .step'); if(!els.length) return;
  let act = 0;
  if(text) a.nodes.forEach((n,i)=>{ if(n[4] && stepHit(n[4], text)) act = Math.max(act, i); });
  els.forEach((el,i)=>{ el.classList.toggle('done', !!fin || i < act); el.classList.toggle('act', !fin && i === act); });
}

/* ---------- 캘린더 불러오기 (읽기 전용) ---------- */
function calIso(d){ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:00`; }
function calWhen(x){
  if(x==null) return '';
  if(typeof x==='string') return x;
  return x.dateTime || x.date || x.time || '';
}
function calText(payload){
  let list = null;
  if(Array.isArray(payload)) list = payload;
  else if(payload && typeof payload==='object') list = payload.events || payload.items || payload.results || null;
  if(!Array.isArray(list)) return { n:null, text: typeof payload==='string' ? payload.slice(0,14000) : JSON.stringify(payload,null,1).slice(0,14000) };
  const evs = list.map(e=>{
    const st = calWhen(e.start||e.startTime), en = calWhen(e.end||e.endTime);
    const allDay = !!(e.allDay || (e.start && e.start.date && !e.start.dateTime));
    return { id: e.id || e.eventId || null, title: e.summary||e.title||'(제목 없음)', start: st, end: en, loc: e.location||'-', allDay };
  });
  const rows = evs.map(x=>`${x.start} ~ ${x.end} | ${x.title} | ${x.loc} | ${x.allDay?'종일':'시간'}`);
  return { n: rows.length, events: evs, text: '시작 ~ 종료 | 일정 | 장소 | 구분\n' + rows.join('\n') };
}
async function calLoad(){
  const a = AGENTS[cur], v = vals[a.id];
  const msg = document.getElementById('calMsg'), btn = document.getElementById('calBtn');
  const say = t=>{ if(msg) msg.innerHTML = '<b>Google 캘린더</b> — ' + t; };
  const days = (v.range||'').indexOf('30')>=0 ? 30 : (v.range||'').indexOf('14')>=0 ? 14 : 7;
  if(btn) btn.disabled = true;
  say('불러오는 중…');
  let mcp = null;
  try{ mcp = (await window.claude?.use?.('mcp')) ?? null; }catch(e){ mcp = null; }
  if(!mcp){ say('이 화면에서는 캘린더 연결을 쓸 수 없음. claude.ai에서 이 페이지를 열거나, 아래 칸에 일정을 붙여넣을 것.'); if(btn) btn.disabled=false; return; }
  const now = new Date(); const end = new Date(now.getTime()+days*86400000);
  try{
    const r = await mcp.callTool('Google Calendar','list_events',{ startTime: calIso(now), endTime: calIso(end), orderBy:'startTime', pageSize:100 },{ cache:false });
    const out = calText(r.payload!==undefined ? r.payload : r.content);
    calState = { events: out.events || null, loadedAt: new Date(), results:{} };
    delete v.__sel;
    const keep = (v.__paste||'').replace(/\[캘린더 일정\][\s\S]*?\[캘린더 일정 끝\]\n*/,'');
    v.__paste = `[캘린더 일정] 오늘부터 ${days}일, 불러온 시각 ${calIso(new Date())}\n${out.text}\n[캘린더 일정 끝]\n\n` + keep;
    paneRun();
    const m2 = document.getElementById('calMsg');
    if(m2) m2.innerHTML = '<b>Google 캘린더</b> — ' + (out.n===null?'일정을 불러옴.':`일정 ${out.n}건을 불러옴.`) + ' 아래 "본문 붙여넣기" 칸에서 확인하고 필요 없는 줄은 지울 것.';
  }catch(e){
    const c = e && e.code;
    const t = c==='needs_reauth' ? 'Google 캘린더 연결이 만료됨. claude.ai 설정의 커넥터에서 다시 연결할 것.'
      : c==='server_not_connected' ? 'Google 캘린더 커넥터가 없음. claude.ai 설정의 커넥터에서 추가하거나, 아래 칸에 일정을 붙여넣을 것.'
      : c==='selection_required' ? 'Google 캘린더 커넥터가 여러 개임. 화면의 안내에서 하나를 고른 뒤 다시 누를 것.'
      : (c==='not_in_manifest'||c==='approval_required'||c==='consent_required') ? '이 페이지의 캘린더 사용을 허용하지 않음. 다시 눌러 허용하거나, 일정을 붙여넣을 것.'
      : c==='blocked_by_policy' ? '기관 정책으로 캘린더 사용이 막혀 있음. 일정을 붙여넣어 진행할 것.'
      : (c==='not_granted'||c==='capability_disabled'||c==='capability_removed') ? '이 화면에서는 캘린더 연결을 쓸 수 없음. 일정을 붙여넣어 진행할 것.'
      : c==='server_unavailable' ? '캘린더가 잠시 응답하지 않음. 조금 뒤 다시 누를 것.'
      : c==='tool_error' ? '캘린더가 오류를 돌려줌: ' + esc(String(e.message||'').slice(0,120))
      : '불러오지 못함. 다시 누르거나 일정을 붙여넣을 것.';
    say(t);
    const b2 = document.getElementById('calBtn'); if(b2) b2.disabled = false;
  }
}

/* ---------- 중요 일정 알림 추가 ---------- */
const CAL_REMIND = { '1일 전 + 1시간 전':[1440,60], '1시간 전':[60], '30분 전':[30], '1일 전':[1440] };
function calDays(st){
  const m = String(st||'').match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m || !calState.loadedAt) return null;
  const d = new Date(+m[1], +m[2]-1, +m[3]); const b = calState.loadedAt;
  const t = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((d - t)/86400000);
}
function calLimit(v){ const u = v.urgent||'3일 이내'; return u.indexOf('오늘')===0 ? 1 : u.indexOf('7')===0 ? 7 : 3; }
function calPanel(v){
  const ev = calState.events.filter(x=>x.id).slice().sort((p,q)=>String(p.start).localeCompare(String(q.start)));
  const lim = calLimit(v);
  if(!('__sel' in v)) v.__sel = ev.filter(x=>{ const d = calDays(x.start); return d!==null && d>=0 && d<=lim; }).map(x=>x.id);
  const rem = v.__rem || '1일 전 + 1시간 전';
  const rows = ev.map(x=>{
    const d = calDays(x.start), on = v.__sel.indexOf(x.id)>=0, res = calState.results[x.id];
    const tag = d===null ? '' : d<=lim ? `<b style="color:var(--red)">D-${d}</b>` : `D-${d}`;
    return `<label style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer">
      <input type="checkbox" class="calchk" value="${esc(x.id)}" ${on?'checked':''} style="width:auto">
      <span style="width:46px">${tag}</span><span style="width:150px;color:var(--t2)">${esc(String(x.start).replace('T',' ').slice(0,16))}</span>
      <span style="flex:1">${esc(x.title)}</span>
      <span style="font-size:12px">${res?(res.ok?'<b style="color:#027A48">알림 추가됨</b>':'<b style="color:var(--red)">실패</b> '+esc(res.msg)):''}</span></label>`;
  }).join('');
  return `<div class="card"><div class="card-h">중요 일정 알림 추가</div>
    <div class="card-s">급한 일정(${esc(v.urgent||'3일 이내')})이 미리 선택돼 있음. 알림을 달 일정을 고른 뒤 단추를 누를 것. 일정 내용과 참석자는 바꾸지 않고 참석자에게 메일도 보내지 않음. 고른 일정의 기존 알림은 아래 설정으로 바뀜.</div>
    ${ev.length ? rows : '<div class="card-s">알림을 달 수 있는 일정이 없음.</div>'}
    <div class="fld" style="margin-top:14px"><label>알림 시점</label><div class="chips" data-k="__rem">${Object.keys(CAL_REMIND).map(k=>`<span class="chip${k===rem?' on':''}" data-v="${k}">${k}</span>`).join('')}</div></div>
    <div class="run" style="margin-top:12px"><button class="btn" id="calRemBtn" ${ev.length?'':'disabled'}>선택한 일정에 알림 추가</button>
    <div class="run-n" id="calRemMsg">캘린더에 쓰는 일은 이 단추 하나뿐임. 누를 때마다 한 번만 실행함.</div></div></div>`;
}
function bindCalPanel(){
  const a = AGENTS[cur], v = vals[a.id];
  document.querySelectorAll('.calchk').forEach(c=>c.onchange=()=>{
    v.__sel = [...document.querySelectorAll('.calchk')].filter(x=>x.checked).map(x=>x.value);
  });
  const b = document.getElementById('calRemBtn'); if(b) b.onclick = calRemind;

let xlsxReady = null;
function needXlsx(){

const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';

/* 글 파일: UTF-8이 아니면 한글 윈도우 인코딩(EUC-KR)으로 읽음 */
function decodeText(buf){
  try{ return new TextDecoder('utf-8', {fatal:true}).decode(buf); }
  catch(e){ try{ return new TextDecoder('euc-kr').decode(buf); }catch(e2){ return new TextDecoder().decode(buf); } }
}
/* docx · hwpx: 압축을 풀어 본문 글만 꺼냄 */
async function unzipText(buf, pick){
  if(typeof DecompressionStream === 'undefined') throw new Error('이 기기의 브라우저에서는 이 형식을 읽을 수 없음. 본문을 복사해 아래 칸에 붙여넣을 것');
  const u = new Uint8Array(buf), dv = new DataView(buf); let e = u.length - 22;
  while(e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if(e < 0) throw new Error('파일이 손상되었거나 형식이 다름');
  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true); const out = [];
  for(let i = 0; i < n; i++){
    const method = dv.getUint16(p + 10, true), csz = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(u.subarray(p + 46, p + 46 + nl));
    if(pick(name)){
      const ds = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true), raw = u.subarray(ds, ds + csz);
      const data = method === 0 ? raw : new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
      out.push([name, new TextDecoder().decode(data)]);
    }
    p += 46 + nl + xl + cl;

}
function xmlLines(xml, ns, P, T, TR, TC){
  const un = s => s.replace(/<[^>]+>/g, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');
  const tag = t => ns + ':' + t;
  const tRe = () => new RegExp('<' + tag(T) + '(?:\\s[^>]*)?>([\\s\\S]*?)</' + tag(T) + '>', 'g');
  const textOf = x => [...x.matchAll(tRe())].map(m => un(m[1])).join('');
  const rowRe = new RegExp('<' + tag(TR) + '(?:\\s[^>]*)?>[\\s\\S]*?</' + tag(TR) + '>', 'g');
  const cellRe = () => new RegExp('<' + tag(TC) + '(?:\\s[^>]*)?>([\\s\\S]*?)</' + tag(TC) + '>', 'g');
  xml = xml.replace(rowRe, r => '\u0001' + [...r.matchAll(cellRe())].map(c => textOf(c[1].split('</' + tag(P) + '>').join(' </' + tag(P) + '>')).replace(/\s+/g, ' ').trim()).join(' | ') + '\u0001');
  const lines = []; let cur = '';
  const tok = new RegExp('\u0001([^\u0001]*)\u0001|<' + tag(T) + '(?:\\s[^>]*)?>([\\s\\S]*?)</' + tag(T) + '>|</' + tag(P) + '>', 'g');
  for(const m of xml.matchAll(tok)){
    if(m[1] !== undefined){ if(cur.trim()) lines.push(cur); cur = ''; lines.push('| ' + m[1] + ' |'); }
    else if(m[2] !== undefined) cur += un(m[2]);
    else { if(cur.trim()) lines.push(cur); cur = ''; }
  }
  if(cur.trim()) lines.push(cur);
  return lines.join('\n');
}
const CUT = 60000;
async function readFile(f){
  const o = {name:f.name, size:f.size, text:'', cols:[], pii:[], raw:null, cut:false};
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  const clip = t => { if(t.length > CUT){ o.cut = true; return t.slice(0, CUT) + '\n(이하 생략 — 길어서 일부만 전달됨)'; } return t; };
  if(ext === 'xlsx' || ext === 'xls' || ext === 'xlsm'){
    await needXlsx();
    const wb = XLSX.read(await f.arrayBuffer(), {type:'array'}); o.raw = wb;
    o.text = wb.SheetNames.map(n => {
      const csv = XLSX.utils.sheet_to_csv(wb.Sheets[n]);
      o.cols.push(...(csv.split('\n')[0] || '').split(',').map(s => s.trim()).filter(Boolean));
      return `--- 시트: ${n} ---\n${clip(csv)}`;
    }).join('\n\n');
  } else if(ext === 'docx'){
    const parts = await unzipText(await f.arrayBuffer(), n => n === 'word/document.xml');
    if(!parts.length) throw new Error('워드 문서의 본문을 찾지 못함');
    o.text = clip(xmlLines(parts[0][1], 'w', 'p', 't', 'tr', 'tc'));
  } else if(ext === 'hwpx'){
    const parts = await unzipText(await f.arrayBuffer(), n => /^Contents\/section\d+\.xml$/.test(n));
    if(!parts.length) throw new Error('한글 문서의 본문을 찾지 못함');
    o.text = clip(parts.map(p => xmlLines(p[1], 'hp', 'p', 't', 'tr', 'tc')).join('\n'));
  } else if(ext === 'pdf'){
    await needPdf();
    const doc = await window.pdfjsLib.getDocument({data: await f.arrayBuffer()}).promise; const pages = [];
    for(let i = 1; i <= doc.numPages; i++){
      const tc = await (await doc.getPage(i)).getTextContent(); let t = '', ly = null;
      for(const it of tc.items){ const y = it.transform ? Math.round(it.transform[5]) : ly; if(ly !== null && y !== ly) t += '\n'; t += it.str; ly = y; }
      pages.push(`--- ${i}쪽 ---\n${t}`);
    }
    o.text = clip(pages.join('\n\n'));
    if(o.text.replace(/--- \d+쪽 ---/g, '').trim().length < 20) throw new Error('PDF에서 글자를 찾지 못함(스캔한 그림 PDF일 수 있음). 본문을 직접 붙여넣을 것');
  } else if(ext === 'hwp' || ext === 'doc' || ext === 'ppt' || ext === 'pptx'){
    throw new Error(ext === 'hwp' ? 'hwp는 읽을 수 없음. 한글에서 [다른 이름으로 저장 → 한글 문서(*.hwpx)]로 저장해 올리거나 본문을 붙여넣을 것' : `${ext} 파일은 읽을 수 없음. 본문을 복사해 아래 칸에 붙여넣을 것`);
  } else if(/^(png|jpe?g|gif|heic|webp|bmp|zip|mp4|mov)$/.test(ext)){
    throw new Error('그림 · 영상 · 압축 파일은 읽을 수 없음. 압축 파일은 풀어서 안의 파일을 올릴 것');
  } else {
    o.text = clip(decodeText(await f.arrayBuffer()));
    o.cols = (o.text.split('\n')[0] || '').split(/[,\t]/).map(s => s.trim()).filter(Boolean);
  }
  if(!o.text.trim()) throw new Error('파일에 읽을 내용이 없음');
  o.pii = [...new Set(o.cols.filter(c => PII.some(k => c.toLowerCase().includes(k.toLowerCase()))))];
  return o;
}

  if(miss.length){
    const bad = files[a.id].filter(f=>f.error);
    w0.innerHTML = `<div class="warn"><b>${sampleOff ? '프롬프트를 만들지 않았음' : '실행하지 않았음'} — 아래 항목이 비어 있음</b>${miss.map(esc).join(' · ')}
      ${bad.length ? `<br><br>올린 파일을 읽지 못했음: ${bad.map(f=>esc(f.name)).join(', ')}. 파일 목록의 붉은 안내대로 하거나, 내용을 복사해 "본문 붙여넣기" 칸에 넣을 것.` : (a.needData ? '<br><br>자료는 파일로 올리거나 "본문 붙여넣기" 칸에 넣을 것. 파일 목록에 "읽음"이 보여야 들어간 것임.' : '')}</div>`;
    w0.scrollIntoView({behavior:'smooth', block:'center'});
    return false;
  }
  return true;
}

/* 프롬프트 만들기 — 실행하지 않고, 실행할 때 보내는 지시문을 그대로 보여 줌 */
function promptOut(pre){
  if(!ready()) return;
  const a = AGENTS[cur], w = document.getElementById('outWrap'), p = prompt();
  w.innerHTML = (pre||'') + `<div class="out"><div class="out-h"><h3>${esc(a.name)} 프롬프트</h3>
      <button class="btn sm" id="pcp">프롬프트 복사</button>
      <a class="btn sm gh" href="https://claude.ai/new" target="_blank" rel="noopener" style="text-decoration:none">Claude 새 채팅 열기</a></div>
    <div class="out-b">
      <div class="note" style="margin-bottom:14px"><b>쓰는 법</b> — ① [프롬프트 복사] ② Claude 새 채팅(claude.ai/new)에 붙여 넣고 보내기. 만든 사람 화면에서 실행할 때 보내는 지시문과 같아서 같은 형식의 결과가 나옴. 넣은 값과 자료가 모두 들어 있음(${p.length.toLocaleString()}자).</div>
      <textarea class="pre" id="ptxt" readonly spellcheck="false" style="width:100%;min-height:340px;resize:vertical"></textarea>
    </div></div>`;
  const ta = document.getElementById('ptxt'), cp = document.getElementById('pcp');
  ta.value = p;
  cp.onclick = ()=>{
    const ok = ()=>{ cp.textContent = '복사함'; setTimeout(()=>cp.textContent = '프롬프트 복사', 1600); };
    const manual = ()=>{
      ta.focus(); ta.select();
      let done = false; try{ done = document.execCommand('copy'); }catch(e){}
      if(done) ok(); else cp.textContent = '아래 칸에서 Ctrl+C로 복사';
    };
    try{ navigator.clipboard.writeText(p).then(ok).catch(manual); }catch(e){ manual(); }
  };
  w.scrollIntoView({behavior:'smooth', block:'start'});
}

async function run(){
  const a = AGENTS[cur];
  if(!ready()) return;
  if(sampleOff){ promptOut(); return; }
  const w = document.getElementById('outWrap'), go = document.getElementById('go'), st = document.getElementById('stop');

  if(sampleReady){
    document.getElementById('rnote').textContent = '실행 기능 확인 중…';
    try{ await sampleReady; }catch(e){}
  }
  if(sample === null){ sampleOff = true; promptOut(); return; }

  running = true; go.disabled = true; st.style.display='';
  document.getElementById('rnote').textContent = '실행 중 — 단계가 많아 1~3분 걸릴 수 있음.';
  w.innerHTML = `<div class="card" style="padding:14px 16px"><div class="card-h" style="margin-bottom:10px">노드 진행</div>${stepBar(a)}</div>
    <div class="out"><div class="out-h"><div class="dot"></div><h3>${esc(a.name)} 실행 결과</h3></div>
    <div class="out-b md" id="ob">준비 중…</div></div>`;
  stepUpdate(a, '', false);
  const ob = document.getElementById('ob');
  abort = new AbortController();
  let full = '';
  const t0 = Date.now();
  const tick = setInterval(()=>{
    if(full) return;
    const s = Math.round((Date.now()-t0)/1000);
    ob.textContent = s < 150
      ? `Claude에게 요청함 (${s}초 지남). 화면에 허용을 묻는 창이 떠 있으면 [허용]을 누를 것. 첫 글자가 나오기까지 1분쯤 걸릴 수 있음.`
      : `아직 응답 대기 중 (${s}초 지남) — 3분이 넘으면 "중지" 후 다시 실행할 것. 허용을 묻는 창이 떠 있는지도 확인.`;
  }, 1000);
  try{
    const r = await sample(prompt(), {
      modelTier:(CONFIG.modelTier||'default'), signal:abort.signal, cache:false,
      onText:({text})=>{ full = text; ob.innerHTML = md(text); stepUpdate(a, text, false); }
    });
    full = r.text || full;
    ob.innerHTML = md(full) + (r.truncated?`<div class="note" style="margin-top:14px"><b>길이 제한으로 중간에 끊김</b> — 입력 자료를 줄이거나 "특별히 보고 싶은 것"을 좁혀 다시 실행할 것.</div>`:'');
    stepUpdate(a, full, !r.truncated);
    done(a, full);
  }catch(e){
    const c = e && e.code;
    if(c==='aborted' || (e&&e.name==='AbortError')){
      ob.innerHTML = md(full || '') + `<div class="note" style="margin-top:14px"><b>중지함</b></div>`;
      if(full) done(a, full);
    } else if(c==='not_granted'){
      promptOut(`<div class="note"><b>이 화면에서 실행이 허용되지 않음</b> — 아래 프롬프트를 복사해 Claude 대화창에서 실행할 것. 허용을 묻는 창에서 거절했다면 다시 실행을 누르고 허용하면 됨.</div>`);
    } else if(c==='rate_limited'){
      promptOut(`<div class="note"><b>요청이 많아 잠시 제한됨</b> — 1~2분 뒤 다시 실행하거나, 아래 프롬프트를 복사해 Claude 대화창에서 실행할 것.</div>`);
    } else {
      promptOut(`<div class="note"><b>이 화면에서 실행하지 못함</b> — ${esc((e&&e.message)||'알 수 없는 오류')}<br>잠시 뒤 다시 실행하거나, 아래 프롬프트를 복사해 Claude 대화창에서 실행할 것.</div>`);
    }
  } finally {
    clearInterval(tick);
    running = false; go.disabled = false; st.style.display='none'; abort = null;
    document.getElementById('rnote').textContent = rnoteText(a);
  }
}

function done(a, text){
  const h = document.querySelector('.out-h');
  if(!h) return;
  h.querySelector('.dot').remove();
  const b1 = document.createElement('button'); b1.className='btn sm gh'; b1.textContent='결과 복사';
  b1.onclick = e=>copy(text, e.target);
  h.appendChild(b1);
  const foot = document.createElement('div');
  foot.className = 'note';
  foot.innerHTML = a.id==='mine' ? `<b>마무리는 직접 활용</b> — 아래에서 맞춤형 MD 파일을 받아, 교육 뒤 내 업무에서 가상 자료로 먼저 써 볼 것. 고친 점은 파일의 "고쳐 쓴 기록"에 적음.` : a.cal ? `<b>마지막 확인은 사람이 함</b> — 급한 일정과 업무 확인표를 캘린더와 맞춰 보고, 완료한 업무는 □에 직접 표시할 것. 일정 등록·변경은 캘린더에서 직접 함.` : `<b>마지막 확인은 사람이 함</b> — 수치 대조표를 원자료와 맞춰 보고, [확인 필요] 항목을 처리한 뒤에 사용할 것.`;
  document.getElementById('outWrap').appendChild(foot);
  if(a.id==='rfp'){
    const hb = document.createElement('div');
    hb.className = 'filebar';
    hb.innerHTML = `<div class="fb-t"><b>다음 단계</b> — 이 분석 결과(배점·요건·제안 목차)를 기획안 에이전트로 넘겨 배점에 맞춘 기획안을 만듦.</div><button class="btn" id="toPlan">이 결과로 기획안 만들기</button>`;
    document.getElementById('outWrap').appendChild(hb);
    hb.querySelector('#toPlan').onclick = ()=>{
      if(running) return;
      const keep = (vals.plan.__paste||'').replace(/\[RFP 분석 결과\][\s\S]*?\[RFP 분석 결과 끝\]\n*/,'');
      vals.plan.__paste = '[RFP 분석 결과]\n' + text.slice(0,12000) + '\n[RFP 분석 결과 끝]\n\n' + keep;
      handoff.plan = true;
      cur = AGENTS.findIndex(x=>x.id==='plan'); tab = 'run'; render();
      document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab==='run'));
      window.scrollTo({top:0,behavior:'smooth'});
    };
  }
  if(a.id==='report' && (vals.report.ask||'').indexOf('질문만')===0) return;
  fileBar(a, text);
  try{ localStorage.setItem('as_last_'+a.id, text.slice(0,200000)); }catch(e){}
}

function copy(t, btn){
  const old = btn.textContent;
  navigator.clipboard.writeText(t).then(()=>{
    btn.textContent='복사함'; setTimeout(()=>btn.textContent=old,1600);
  }).catch(()=>{ btn.textContent='복사 실패'; setTimeout(()=>btn.textContent=old,1600); });
}

/* ---------- 간단 마크다운 ---------- */
function md(s){
  if(!s) return '';
  const lines = String(s).split('\n');
  let o = '', i = 0, inUl = false, inOl = false;
  const close = ()=>{ if(inUl){o+='</ul>';inUl=false} if(inOl){o+='</ol>';inOl=false} };
  const inl = t => esc(t)
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
  while(i < lines.length){
    const L = lines[i];
    if(/^\s*\|/.test(L) && /^\s*\|[\s:|-]+\|?\s*$/.test(lines[i+1]||'')){
      close();
      const cells = r => r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head = cells(L); i += 2;
      let body = '';
      while(i<lines.length && /^\s*\|/.test(lines[i])){
        body += '<tr>'+cells(lines[i]).map(c=>`<td>${inl(c)}</td>`).join('')+'</tr>'; i++;
      }
      o += `<table><thead><tr>${head.map(c=>`<th>${inl(c)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;
      continue;
    }
    if(/^\s*```/.test(L)){
      close(); i++;
      let code = '';
      while(i<lines.length && !/^\s*```/.test(lines[i])){ code += lines[i]+'\n'; i++; }
      i++;
      o += `<div class="pre">${esc(code)}</div>`;
      continue;
    }
    const hm = L.match(/^(#{1,4})\s+(.*)$/);
    if(hm){ close(); const n=hm[1].length; o+=`<h${n}>${inl(hm[2])}</h${n}>`; i++; continue; }
    if(/^\s*([-*]{3,}|_{3,})\s*$/.test(L)){ close(); o+='<hr>'; i++; continue; }
    const um = L.match(/^\s*[-*]\s+(.*)$/);
    if(um){ if(inOl){o+='</ol>';inOl=false} if(!inUl){o+='<ul>';inUl=true} o+=`<li>${inl(um[1])}</li>`; i++; continue; }
    const om = L.match(/^\s*\d+[.)]\s+(.*)$/);
    if(om){ if(inUl){o+='</ul>';inUl=false} if(!inOl){o+='<ol>';inOl=true} o+=`<li>${inl(om[1])}</li>`; i++; continue; }
    const bm = L.match(/^\s*>\s?(.*)$/);
    if(bm){ close(); o+=`<blockquote>${inl(bm[1])}</blockquote>`; i++; continue; }
    if(!L.trim()){ close(); i++; continue; }
    close(); o += `<p>${inl(L)}</p>`; i++;
  }
  close();
  return o;
}

/* ---------- 렌더 ---------- */
function render(){
  nav(); head();
  ['run','flow','rules'].forEach(t=>{
    document.getElementById('pane'+t[0].toUpperCase()+t.slice(1)).classList.toggle('hide', t!==tab);
  });
  if(tab==='run') paneRun();
  if(tab==='flow') paneFlow();
  if(tab==='rules') paneRules();
}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  if(running) return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); tab = t.dataset.tab; render();
});

render();

/* ---------- hwpx 파일 만들기 (한 장 보고서 양식 기반) ---------- */
const HW = (()=>{
  const enc = new TextEncoder();
  const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
  const xe = s => String(s==null?'':s)
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F﻿]/g,'')
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const clean = s => String(s==null?'':s).replace(/\*\*/g,'').replace(/`/g,'').replace(/\s+/g,' ').trim();

  /* 문단 종류 → 양식의 서식 번호 */
  const ST = {
    h:    [15,14,7],   // 레벨1: 개요·본문·결론·참고문헌
    lead: [16,15,8],   // 레벨2: 요약 문장
    body: [18,0,10],   // 본문 항목
    sub:  [17,16,9],   // 레벨3: 세부 항목
    plain:[0,0,1],     // 일반 줄
    gap:  [0,0,2]      // 빈 줄
  };
  const P = (k, t) => {
    const [pp, st, cp] = ST[k];
    const run = (k==='gap' || !t) ? `<hp:run charPrIDRef="${cp}"/>` : `<hp:run charPrIDRef="${cp}"><hp:t>${xe(t)}</hp:t></hp:run>`;
    return `<hp:p id="2147483648" paraPrIDRef="${pp}" styleIDRef="${st}" pageBreak="0" columnBreak="0" merged="0">${run}<hp:linesegarray/></hp:p>`;
  };

  /* CRC32 + 무압축 ZIP (mimetype을 맨 앞에 저장) */
  const CT = (()=>{ const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
  const crc = u => { let c = 0xFFFFFFFF; for(let i=0;i<u.length;i++) c = CT[(c^u[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
  function zip(entries){
    const parts = [], cen = []; let off = 0;
    for(const [name, data] of entries){
      const nb = enc.encode(name), c = crc(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
      lh.setUint16(10,0,true); lh.setUint16(12,0x21,true);
      lh.setUint32(14,c,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true);
      lh.setUint16(26,nb.length,true); lh.setUint16(28,0,true);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true);
      ch.setUint16(12,0,true); ch.setUint16(14,0x21,true);
      ch.setUint32(16,c,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true);
      ch.setUint16(28,nb.length,true); ch.setUint32(42,off,true);
      parts.push(new Uint8Array(lh.buffer), nb, data);
      cen.push(new Uint8Array(ch.buffer), nb);
      off += 30 + nb.length + data.length;
    }
    let cs = 0; for(const p of cen) cs += p.length;
    const e = new DataView(new ArrayBuffer(22));
    e.setUint32(0,0x06054b50,true); e.setUint16(8,entries.length,true); e.setUint16(10,entries.length,true);
    e.setUint32(12,cs,true); e.setUint32(16,off,true);
    const all = [...parts, ...cen, new Uint8Array(e.buffer)];
    let n = 0; for(const p of all) n += p.length;
    const out = new Uint8Array(n); let o = 0;
    for(const p of all){ out.set(p,o); o += p.length; }
    return out;
  }

  /* 제목 + 문단 목록 → hwpx 바이트 */
  function build(title, paras){
    const sec = HWPX_HEAD.replace('{{TITLE}}', xe(clean(title) || '보고서')) + paras.map(([k,t])=>P(k,t)).join('') + '</hs:sec>';
    const prv = '<' + clean(title) + '>\r\n\r\n' + paras.map(([k,t])=>t||'').join('\r\n');
    const F = HWPX_FILES;
    return zip([
      ['mimetype', enc.encode('application/hwp+zip')],
      ['version.xml', b64(F['version.xml'])],
      ['Contents/header.xml', b64(F['Contents/header.xml'])],
      ['Contents/section0.xml', enc.encode(sec)],
      ['Contents/content.hpf', b64(F['Contents/content.hpf'])],
      ['Preview/PrvText.txt', enc.encode(prv.slice(0,1000))],
      ['Preview/PrvImage.png', b64(F['Preview/PrvImage.png'])],
      ['settings.xml', b64(F['settings.xml'])],
      ['META-INF/container.rdf', b64(F['META-INF/container.rdf'])],
      ['META-INF/container.xml', b64(F['META-INF/container.xml'])],
      ['META-INF/manifest.xml', b64(F['META-INF/manifest.xml'])]
    ]);
  }

  const arr = v => (Array.isArray(v) ? v : (v ? [v] : [])).map(clean).filter(Boolean);

  /* 한 장 보고서: 양식의 칸 그대로 */
  function onePage(d){
    d = d || {};
    const det = arr(d.details).slice(0,2);
    const paras = [
      ['h','개요'], ['lead', clean(d.overview)], ['gap'], ['gap'],
      ['h','본문'],
      ['body', clean(d.plan)], ['body', clean(d.a1)], ['body', clean(d.a2)], ['body', clean(d.a3)], ['body', clean(d.solution)],
      ['gap'], ['gap'],
      ['h','결론'], ['lead', clean(d.conclusion)],
      ...det.map(t=>['sub',t]),
      ['gap'], ['gap'],
      ['h','참고문헌'], ['body', arr(d.refs).join(' / ') || '제공된 원자료']
    ];
    return build(d.title, paras.filter(([k,t])=>k==='gap' || t));
  }

  /* 3장 이내 보고서: 본문 항목마다 세부 항목을 덧붙이고, 분량을 줄 수로 제한 */
  const lines = (t, w) => Math.max(1, Math.ceil(String(t||'').length / w));
  function threePage(d){
    d = d || {};
    const secs = (Array.isArray(d.sections) ? d.sections : []).slice(0,6)
      .map(s=>({lead: clean(s && s.lead), subs: arr(s && s.subs)})).filter(s=>s.lead);
    const ov = arr(d.overview).slice(0,3), det = arr(d.details).slice(0,5), chk = arr(d.checks).slice(0,6), refs = arr(d.refs).slice(0,5);
    let cap = 4;
    const make = () => {
      const p = [['h','개요'], ...ov.map(t=>['lead',t]), ['gap'], ['h','본문']];
      for(const s of secs){ p.push(['body', s.lead]); for(const t of s.subs.slice(0,cap)) p.push(['sub', t]); }
      p.push(['gap'], ['h','결론'], ['lead', clean(d.conclusion)], ...det.map(t=>['sub',t]));
      if(chk.length) p.push(['gap'], ['h','확인 필요 사항'], ...chk.map(t=>['body',t]));
      p.push(['gap'], ['h','참고문헌'], ...(refs.length ? refs : ['제공된 원자료']).map(t=>['body',t]));
      return p.filter(([k,t])=>k==='gap' || t);
    };
    const est = p => p.reduce((n,[k,t])=> n + (k==='gap' ? 0.8 : k==='h' ? 1.1 : lines(t, k==='sub' ? 36 : 34)), 4);
    let p = make();
    while(est(p) > 84 && cap > 1){ cap--; p = make(); }   // 한 쪽 약 30줄 기준, 3쪽 안에 들도록
    return build(d.title, p);
  }

  /* 실행 결과(마크다운) 전체 → hwpx */
  function fromMarkdown(title, mdText){
    const out = [];
    for(const raw of String(mdText||'').split('\n')){
      const l = raw.replace(/\s+$/,'');
      if(!l.trim()){ if(out.length && out[out.length-1][0] !== 'gap') out.push(['gap']); continue; }
      if(/^\s*\|?\s*:?-{2,}/.test(l) && /^[\s|:\-]+$/.test(l)) continue;      // 표 구분선
      let m;
      if((m = l.match(/^#{1,6}\s+(.*)$/))) out.push(['h', clean(m[1])]);
      else if(/^\s*\|.*\|\s*$/.test(l)) out.push(['plain', l.trim().replace(/^\||\|$/g,'').split('|').map(clean).join('  |  ')]);
      else if((m = l.match(/^(\s*)(?:[-*•]|\d+[.)])\s+(.*)$/))) out.push([m[1].length >= 2 ? 'sub' : 'body', clean(m[2])]);
      else if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)) continue;
      else out.push(['plain', clean(l)]);
    }
    return build(title, out);
  }

  return { onePage, threePage, fromMarkdown, zip };
})();

/* ============================================================
   결과를 파일로 받기 — 형식을 물어본 뒤 만든다 (hwpx · docx · pdf · md)

let downloads = null;
const dlReady = (async()=>{ try{ downloads = (await window.claude?.use?.('downloads')) ?? null; }catch(e){ downloads = null; } })();

/* 마크다운 → 문서 블록 */
function mdBlocks(src){
  const L = String(src||'').replace(/\r/g,'').split('\n'), out = [];
  const cells = r => r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  let i = 0;
  while(i < L.length){
    const s = L[i];
    if(/^\s*```/.test(s)){
      i++; const buf = [];
      while(i < L.length && !/^\s*```/.test(L[i])){ buf.push(L[i]); i++; }
      i++; out.push({t:'code', lines:buf}); continue;
    }
    if(/^\s*\|/.test(s) && /^\s*\|[\s:|-]+\|?\s*$/.test(L[i+1]||'')){
      const head = cells(s); i += 2; const rows = [];
      while(i < L.length && /^\s*\|/.test(L[i])){ const r = cells(L[i]); while(r.length < head.length) r.push(''); rows.push(r.slice(0, head.length)); i++; }
      out.push({t:'table', head, rows}); continue;
    }
    let m;
    if((m = s.match(/^(#{1,6})\s+(.*)$/))){ out.push({t:'h', lv:Math.min(3, m[1].length), x:m[2]}); i++; continue; }
    if(/^\s*([-*]{3,}|_{3,})\s*$/.test(s)){ i++; continue; }
    if((m = s.match(/^(\s*)(?:[-*•]|\d+[.)])\s+(.*)$/))){ out.push({t:'li', lv:m[1].length >= 2 ? 1 : 0, x:m[2]}); i++; continue; }
    if((m = s.match(/^\s*>\s?(.*)$/))){ out.push({t:'quote', x:m[1]}); i++; continue; }
    if(!s.trim()){ i++; continue; }
    out.push({t:'p', x:s.trim()}); i++;
  }
  return out;
}
/* **굵게** → 조각 */
function runsOf(s){
  const out = []; let b = false;
  String(s==null?'':s).replace(/`/g,'').split('**').forEach(seg=>{ if(seg) out.push({x:seg, b}); b = !b; });
  return out.length ? out : [{x:'', b:false}];
}
const plainOf = s => runsOf(s).map(r=>r.x).join('');
const xmlEsc = s => String(s==null?'':s)
  .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F﻿]/g,'')
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const DOCX = (()=>{

    return `<w:p>${ppr}${runsOf(text).map(r=>run(r, sz, o.bold)).join('')}</w:p>`;
  };

    const row = (r, head) => `<w:tr>${head?'<w:trPr><w:tblHeader/></w:trPr>':''}${r.map(c=>cell(c, head)).join('')}</w:tr>`;
    return `<w:tbl><w:tblPr><w:tblW w:w="${W}" w:type="dxa"/><w:tblBorders>${['top','left','bottom','right','insideH','insideV'].map(bd).join('')}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${'<w:gridCol w:w="'+cw+'"/>'.repeat(n)}</w:tblGrid>${row(b.head,true)}${b.rows.map(r=>row(r,false)).join('')}</w:tbl>${para('',{after:60})}`;
  };
  function make(title, mdText){

      else if(b.t==='li') body += para((b.lv?'- ':'· ') + b.x, {ind:b.lv?720:360, hang:200, after:60});
      else if(b.t==='quote') body += para(b.x, {ind:360, shade:'F4F6F9'});
      else if(b.t==='code') b.lines.forEach(l=>{ body += para(l || ' ', {sz:18, after:0, line:280, shade:'F4F6F9'}); });
      else if(b.t==='table') body += table(b);
      else body += para(b.x);
    }
    const NS = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"';
    const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document ${NS}><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1417" w:right="1134" w:bottom="1417" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`;
    const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles ${NS}><w:docDefaults><w:rPrDefault><w:rPr>${F}<w:sz w:val="21"/><w:szCs w:val="21"/><w:lang w:val="en-US" w:eastAsia="ko-KR"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="100" w:line="340" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>`;
    const ct = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`;
    const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
    const drels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
    return HW.zip([
      ['[Content_Types].xml', enc.encode(ct)], ['_rels/.rels', enc.encode(rels)],
      ['word/document.xml', enc.encode(doc)], ['word/styles.xml', enc.encode(styles)],
      ['word/_rels/document.xml.rels', enc.encode(drels)]
    ]);
  }
  return { make };
})();

/* ---------- PDF (화면 글꼴로 쪽을 그려 PDF로 묶음. 외부 라이브러리 없음) ---------- */
const PDFX = (()=>{
  const PW = 1240, PH = 1754, MX = 112, MT = 120, MB = 130, CW = PW - MX*2;
  const FAM = "'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif";
  const font = (sz, b) => `${b?700:400} ${sz}px ${FAM}`;
  function wrap(ctx, runs, sz, width){
    const lines = []; let line = [], w = 0, lastSp = -1;
    const flush = () => { lines.push(line); line = []; w = 0; lastSp = -1; };
    for(const r of runs){
      ctx.font = font(sz, r.b);
      for(const ch of r.x){
        const cw = ctx.measureText(ch).width;
        if(w + cw > width && line.length){
          if(ch === ' '){ flush(); continue; }
          if(lastSp >= 0 && /[A-Za-z0-9]/.test(ch) && lastSp > line.length - 24){
            const rest = line.splice(lastSp + 1); line.pop(); lines.push(line);
            line = rest; w = rest.reduce((n,c)=>n + c.w, 0); lastSp = -1;
          } else flush();

        line.push({ch, b:r.b, w:cw}); w += cw;
        if(ch === ' ') lastSp = line.length - 1;

    for(const c of line){
      if(c.b !== bb){ out(); buf = ''; bb = c.b; bx = cx; }

  }
  async function make(title, mdText, foot){
    try{ if(document.fonts && document.fonts.load){ await Promise.all([document.fonts.load(font(22,false),'가'), document.fonts.load(font(22,true),'가')]); } }catch(e){}

    const newPage = () => {
      const c = document.createElement('canvas'); c.width = PW; c.height = PH;

    const text = (s, o) => {
      o = o || {}; const sz = o.sz || 22, lh = Math.round(sz * (o.lh || 1.62)), x = MX + (o.ind || 0);
      const runs = o.bold ? [{x:plainOf(s), b:true}] : runsOf(s);
      const lines = wrap(ctx, runs, sz, CW - (o.ind || 0));
      y += o.before || 0;
      if(o.keep) need(lh * Math.min(lines.length, 2) + 60);
      lines.forEach((ln, i) => {
        need(lh);
        if(o.bg){ ctx.fillStyle = o.bg; ctx.fillRect(MX, y, CW, lh); }
        if(i === 0 && o.mark){ ctx.font = font(sz,false); ctx.fillStyle = '#475467'; ctx.fillText(o.mark, x - 24, y + sz); }
        drawLine(ctx, ln, x + (o.bg ? 12 : 0), y + sz, sz, o.color);
        y += lh;
      });
      y += o.after == null ? 10 : o.after;
    };
    const table = b => {
      const n = b.head.length, sz = 18, lh = 28, pad = 9;
      const wt = b.head.map((h, i) => Math.max(4, Math.min(30, Math.max(plainOf(h).length, ...b.rows.map(r => plainOf(r[i]||'').length)))));
      const sum = wt.reduce((a,c)=>a + c, 0), cw = wt.map(v => Math.floor(CW * v / sum));
      const row = (r, head) => {
        const cl = r.map((c, i) => wrap(ctx, head ? [{x:plainOf(c), b:true}] : runsOf(c), sz, cw[i] - pad*2));
        const h = Math.max(...cl.map(l => l.length)) * lh + pad*2;
        if(y + h > PH - MB){ newPage(); if(!head) row(b.head, true); }
        let x = MX;
        cl.forEach((lines, i) => {
          if(head){ ctx.fillStyle = '#EEF2F7'; ctx.fillRect(x, y, cw[i], h); }
          ctx.strokeStyle = '#9AA4B2'; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, cw[i], h);
          lines.forEach((ln, k) => drawLine(ctx, ln, x + pad, y + pad + sz + k*lh - 2, sz));
          x += cw[i];
        });
        y += h;
      };
      y += 6; row(b.head, true); b.rows.forEach(r => row(r, false)); y += 18;
    };
    newPage();
    if(title){ text(title, {sz:34, bold:true, lh:1.4, after:8}); ctx.fillStyle = '#1E3A8A'; ctx.fillRect(MX, y, CW, 3); y += 30; }
    for(const b of mdBlocks(mdText)){
      if(b.t==='h') text(b.x, {sz:[28,25,23][b.lv-1], bold:true, before:b.lv===1?22:14, after:8, keep:1, color:b.lv===1?'#1E3A8A':'#101828'});
      else if(b.t==='li') text(b.x, {ind:b.lv?64:32, mark:b.lv?'-':'·', after:4});
      else if(b.t==='quote') text(b.x, {bg:'#F4F6F9', color:'#475467'});
      else if(b.t==='code'){ b.lines.forEach(l => text(l || ' ', {sz:18, lh:1.5, after:0, bg:'#F4F6F9'})); y += 12; }
      else if(b.t==='table') table(b);
      else text(b.x);
    }
    pages.forEach((c, i) => {
      const g = c.getContext('2d'); g.font = font(16,false); g.fillStyle = '#98A2B3'; g.textBaseline = 'alphabetic';
      g.fillText(foot || '', MX, PH - 70);
      const t = (i+1) + ' / ' + pages.length; g.fillText(t, PW - MX - g.measureText(t).width, PH - 70);
    });
    /* 쪽 이미지를 PDF 한 파일로 */
    const enc = new TextEncoder(), parts = [], offs = []; let pos = 0;
    const put = d => { const u = typeof d === 'string' ? enc.encode(d) : d; parts.push(u); pos += u.length; };
    const obj = (n, body) => { offs[n] = pos; put(`${n} 0 obj\n`); body(); put('\nendobj\n'); };
    put('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    const N = pages.length, kids = [];
    for(let i = 0; i < N; i++) kids.push(`${3 + i*3} 0 R`);
    obj(1, () => put('<< /Type /Catalog /Pages 2 0 R >>'));
    obj(2, () => put(`<< /Type /Pages /Count ${N} /Kids [${kids.join(' ')}] >>`));
    for(let i = 0; i < N; i++){
      const jpg = Uint8Array.from(atob(pages[i].toDataURL('image/jpeg', 0.9).split(',')[1]), c => c.charCodeAt(0));
      const p = 3 + i*3, cs = 'q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
      obj(p, () => put(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${p+2} 0 R >> >> /Contents ${p+1} 0 R >>`));
      obj(p+1, () => put(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
      obj(p+2, () => { put(`<< /Type /XObject /Subtype /Image /Width ${PW} /Height ${PH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`); put(jpg); put('\nendstream'); });
    }
    const xref = pos, cnt = 3 + N*3;
    put(`xref\n0 ${cnt}\n0000000000 65535 f \n`);
    for(let n = 1; n < cnt; n++) put(String(offs[n]).padStart(10,'0') + ' 00000 n \n');
    put(`trailer\n<< /Size ${cnt} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
    let len = 0; for(const u of parts) len += u.length;
    const out = new Uint8Array(len); let o = 0; for(const u of parts){ out.set(u, o); o += u.length; }
    return { bytes: out, pages: N };
  }
  return { make };
})();

/* ---------- 보고서: 한 장 · 3장 정리본을 마크다운으로 ---------- */
const arrOf = v => (Array.isArray(v) ? v : (v ? [v] : [])).map(x => String(x||'').trim()).filter(Boolean);
function oneMd(d){
  d = d || {};
  return ['## 개요', d.overview || '', '', '## 본문', ...[d.plan, d.a1, d.a2, d.a3, d.solution].filter(Boolean).map(x => '- ' + x), '',
    '## 결론', d.conclusion || '', ...arrOf(d.details).slice(0,2).map(x => '- ' + x), '',
    '## 참고문헌', ...(arrOf(d.refs).length ? arrOf(d.refs) : ['제공된 원자료']).map(x => '- ' + x)].join('\n');
}
function threeMd(d){
  d = d || {}; const o = ['## 개요', ...arrOf(d.overview).slice(0,3).map(x => '- ' + x), '', '## 본문'];
  (Array.isArray(d.sections) ? d.sections : []).slice(0,6).forEach(s => { if(s && s.lead){ o.push('- ' + s.lead); arrOf(s.subs).slice(0,4).forEach(x => o.push('  - ' + x)); } });
  o.push('', '## 결론', d.conclusion || '', ...arrOf(d.details).slice(0,5).map(x => '- ' + x));
  if(arrOf(d.checks).length) o.push('', '## 확인 필요 사항', ...arrOf(d.checks).slice(0,6).map(x => '- ' + x));
  o.push('', '## 참고문헌', ...(arrOf(d.refs).length ? arrOf(d.refs) : ['제공된 원자료']).map(x => '- ' + x));
  return o.join('\n');
}

/* ---------- 파일 형식 묻기 → 만들기 → 저장 ---------- */
const FORMATS = [
  ['hwpx','한글 (hwpx)','한글 2014 이상에서 바로 열림. 압축(zip)으로 저장되므로 풀어서 열 것.'],
  ['docx','워드 (docx)','MS 워드 · 한글 · 구글 문서에서 열림. 표는 워드 표로 들어감.'],
  ['pdf','PDF','그대로 보거나 인쇄하는 용도. 글자를 고칠 수 없으므로 수정할 문서는 한글이나 워드로 받을 것.'],
  ['hwp','한글 옛 형식 (hwp)','hwp는 이 페이지에서 직접 만들 수 없음. hwpx로 저장되며, 한글에서 열어 [파일 → 다른 이름으로 저장 → 한글 문서(*.hwp)]를 고르면 hwp가 됨.'],
  ['md','글 파일 (md)','메모장에서 열리는 글 파일. Claude 프로젝트에 다시 올려 쓸 때 편함.']
];
let fileRun = 0;
function fileBar(a, text){
  if(a.id === 'mine') mdBar(text);
  const my = ++fileRun, isReport = a.id === 'report';
  const st = { fmt:'hwpx', kind: isReport ? 'one' : 'full', json:null };
  const KINDS = isReport ? [['one','한 장 보고서'],['three','3장 이내 보고서'],['full','분석 결과 전체']] : [['full', a.id==='mine' ? '설계 결과 전체' : '실행 결과 전체']];
  const box = document.createElement('div');
  box.className = 'card';
  box.innerHTML = `<div class="card-h">결과를 파일로 받기</div>
    <div class="card-s">어떤 파일로 받을지 고른 뒤 "파일 받기"를 누를 것. 형식을 바꿔 여러 번 받을 수 있음.</div>
    ${KINDS.length > 1 ? `<div class="fld"><label>무엇을 받을까</label><div class="chips" id="fxKind">${KINDS.map(k=>`<div class="chip${k[0]===st.kind?' on':''}" data-v="${k[0]}">${k[1]}</div>`).join('')}</div></div>` : ''}
    <div class="fld"><label>파일 형식</label><div class="chips" id="fxFmt">${FORMATS.map(f=>`<div class="chip${f[0]===st.fmt?' on':''}" data-v="${f[0]}">${f[1]}</div>`).join('')}</div>
      <div class="hint" id="fxHint"></div></div>
    <div class="run"><button class="btn" id="fxGo">파일 받기</button><div class="run-n" id="fxMsg"></div></div>`;
  document.getElementById('outWrap').appendChild(box);
  const msg = box.querySelector('#fxMsg'), btn = box.querySelector('#fxGo'), hint = box.querySelector('#fxHint');
  const showHint = () => { hint.textContent = (FORMATS.find(f=>f[0]===st.fmt)||[])[2] || ''; };
  showHint();
  const bind = (id, key) => { const g = box.querySelector(id); if(!g) return; g.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    g.querySelectorAll('.chip').forEach(x => x.classList.remove('on')); c.classList.add('on'); st[key] = c.dataset.v; showHint(); msg.textContent = ''; }); };
  bind('#fxKind','kind'); bind('#fxFmt','fmt');

  const base = a.short.replace(/[^가-힣A-Za-z0-9]+/g,'_');
  const getJson = async () => {
    if(st.json) return st.json;
    const t0 = Date.now();
    const tk = setInterval(() => { msg.innerHTML = `<b>한 장 · 3장 보고서로 정리하는 중</b> (${Math.round((Date.now()-t0)/1000)}초 지남 · 보통 1분 안팎)`; }, 1000);
    try{
      const j = await sample.json(REPORT_JSON_PROMPT(text), { modelTier:'default' });
      if(!j || !j.one || !j.three) throw {code:'invalid_json'};
      st.json = j; return j;
    } finally { clearInterval(tk); }
  };
  const build = async () => {
    const fmt = st.fmt === 'hwp' ? 'hwpx' : st.fmt;
    let title = (a.cal ? '일정 브리핑' : a.name + ' 실행 결과'), body = text, label = KINDS.find(k=>k[0]===st.kind)[1], j = null;
    if(st.kind !== 'full'){
      j = await getJson();
      const d = st.kind === 'one' ? j.one : j.three;
      title = d.title || title; body = st.kind === 'one' ? oneMd(d) : threeMd(d);
    }
    const name = `${base}_${label.replace(/\s+/g,'')}`;
    if(fmt === 'md') return { filename: name + '.md', data: new Blob([`# ${title}\n\n${body}\n`]) };
    if(fmt === 'docx') return { filename: name + '.docx', data: new Blob([DOCX.make(title, body)]) };
    if(fmt === 'pdf'){ const r = await PDFX.make(title, body, CONFIG.org || ''); return { filename: name + '.pdf', data: new Blob([r.bytes]), note: `${r.pages}쪽` }; }
    const hw = st.kind === 'one' ? HW.onePage(j.one) : st.kind === 'three' ? HW.threePage(j.three) : HW.fromMarkdown(title, body);
    return { filename: name + '_hwpx.zip', data: new Blob([HW.zip([[name + '.hwpx', hw]])]), note: '압축을 풀면 hwpx 파일이 나옴' };
  };
  btn.onclick = async () => {
    if(my !== fileRun) return;
    btn.disabled = true; msg.textContent = '파일을 만드는 중…';
    let f = null;
    try{ f = await build(); }
    catch(e){
      const c = e && e.code;
      msg.innerHTML = c === 'rate_limited' ? '<b>요청이 많아 잠시 제한됨</b> — 1~2분 뒤 다시 누를 것.'
        : c === 'not_granted' ? '<b>실행 권한이 없어 보고서를 정리하지 못함</b> — "분석 결과 전체"로 받을 것.'
        : '<b>파일을 만들지 못함</b> — 다시 누르거나 다른 형식을 고를 것.';
      btn.disabled = false; return;
    }
    await dlReady;
    try{
      if(downloads){ await downloads.save({ filename: f.filename, data: f.data }); }
      else {
        const u = URL.createObjectURL(f.data), l = document.createElement('a');
        l.href = u; l.download = f.filename; document.body.appendChild(l); l.click(); l.remove();
        setTimeout(() => URL.revokeObjectURL(u), 4000);
      }
      msg.innerHTML = `<b>저장함</b> — ${esc(f.filename)}${f.note ? ' · ' + esc(f.note) : ''}. ${st.fmt==='hwp' ? '한글에서 열어 "다른 이름으로 저장"으로 hwp로 바꿀 것.' : '수치는 대조표와 맞춰 본 뒤 사용.'}${downloads ? '' : ' 저장되지 않았다면 "결과 복사"로 붙여넣을 것.'}`;
    }catch(e){
      const c = e && e.code;
      msg.innerHTML = c === 'declined' ? '<b>저장을 취소함</b> — 다시 누르면 저장 창이 뜸.'
        : c === 'rate_limited' ? '<b>잠시 뒤 다시 누를 것</b> — 저장 창이 이미 떠 있거나 요청이 많음.'
        : '<b>저장하지 못함</b> — 다른 형식을 고르거나 "결과 복사"로 붙여넣을 것.';
    }finally{ btn.disabled = false; }
  };
}

/* 실행 기능 연결 */
sampleReady = (async()=>{
  try{ sample = (await window.claude?.use?.('sample')) ?? null; }catch(e){ sample = null; }
  if(sample === null && window.claude && typeof window.claude.complete === 'function'){
    const ask = async (p, o) => { const text = String(await window.claude.complete(p) || ''); if(o && o.onText) o.onText({text, delta:text}); return {text, truncated:false}; };
    ask.json = async p => { const t = String(await window.claude.complete(p) || ''); const m = t.match(/\{[\s\S]*\}/); return JSON.parse(m ? m[0] : t); };
    sample = ask;
  }
  if(sample === null){ sampleOff = true; if(tab === 'run' && !running) paneRun(); }
})();
