<title>AI 활용평가 연습실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 레이아웃: 한 화면 한 단계(문제/채팅/결과), 상단에 진행·타이머 바 */
:root{
  --bg:#fff8f0; --surface:#ffffff; --fg:#2a2440; --muted:#6e6888; --line:#f0e3d6;
  --accent:#5b4cf0; --accent-soft:#efecff; --sun:#ffb938; --sun-soft:#fff3d9; --pink:#ff7aa8;
  --good:#14935c; --good-soft:#dcf7e9;
  --warn:#b86e00; --warn-soft:#fff0d2; --bad:#e0413a; --bad-soft:#ffe6e4;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12131b; --surface:#1b1d29; --fg:#e8e9f1; --muted:#9a9fb5; --line:#2e3142;
  --accent:#a99dff; --accent-soft:#2a2552; --sun:#ffc85c; --sun-soft:#3a2e14; --pink:#ff94b8; --good:#6fd39f; --good-soft:#173527;
  --warn:#f0b452; --warn-soft:#3a2c12; --bad:#ff8a80; --bad-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12131b; --surface:#1b1d29; --fg:#e8e9f1; --muted:#9a9fb5; --line:#2e3142;
  --accent:#a99dff; --accent-soft:#2a2552; --sun:#ffc85c; --sun-soft:#3a2e14; --pink:#ff94b8; --good:#6fd39f; --good-soft:#173527;
  --warn:#f0b452; --warn-soft:#3a2c12; --bad:#ff8a80; --bad-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:radial-gradient(circle at 0% 0%,var(--sun-soft),transparent 45%),radial-gradient(circle at 100% 10%,var(--accent-soft),transparent 40%),var(--bg);background-attachment:fixed;color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-size:13px;color:var(--muted);letter-spacing:.04em}
.steps{display:flex;gap:6px}
.steps span{width:28px;height:6px;border-radius:3px;background:var(--line)}
.steps span.on{background:linear-gradient(90deg,var(--accent),var(--pink))}
.brand{font-weight:700;color:var(--accent)}
h1{font-size:clamp(22px,5vw,30px);line-height:1.3;margin:0;text-wrap:balance}
h2{font-size:20px;margin:0;text-wrap:balance}
.eyebrow{font-size:13px;color:var(--muted);margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 10px 30px -18px rgba(91,76,240,.35);border-top:6px solid var(--sun);display:flex;flex-direction:column;gap:16px}
.passage{background:var(--sun-soft);border-radius:12px;padding:14px 16px;color:var(--fg)}
.eyebrow{display:inline-block;align-self:flex-start;background:var(--accent-soft);color:var(--accent)!important;font-weight:700;padding:3px 12px;border-radius:999px}
.q{font-weight:700}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;text-align:left;width:100%;padding:14px;border:2px solid var(--line);border-radius:14px;transition:transform .15s,border-color .15s;
  background:var(--surface);color:var(--fg);font:inherit;cursor:pointer;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.num{font-family:var(--mono);color:var(--accent);flex:none}
.timer{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--pink),var(--accent));transition:width 1s linear}
.timer.low .bar i{background:var(--bad)}
.time{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
.timer.low .time{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap}
button.btn{font:inherit;font-weight:700;padding:12px 22px;border-radius:999px;border:2px solid var(--accent);
  background:linear-gradient(135deg,var(--accent),var(--pink));border-color:transparent;color:var(--surface);cursor:pointer;min-height:48px}
button.btn.ghost{background:transparent;color:var(--accent);border-color:var(--accent)}
button.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.explain{display:flex;flex-direction:column;gap:10px}
.explain dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.explain dt{font-weight:700;color:var(--accent);white-space:nowrap}
.explain dd{margin:0;min-width:0}
.verdict{font-weight:700;padding:10px 14px;border-radius:8px}
.verdict.ok{background:var(--good-soft);color:var(--good)} .verdict.no{background:var(--bad-soft);color:var(--bad)}
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:12px 14px;border-radius:12px;white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}
.msg.them{background:var(--sun-soft);align-self:flex-start;border-top-left-radius:4px}
.msg.me{background:linear-gradient(135deg,var(--accent),var(--pink));color:var(--surface);align-self:flex-end;border-top-right-radius:4px}
.msg.ai{background:var(--surface);border:1px dashed var(--line);align-self:flex-start}
.who{display:block;font-size:12px;opacity:.75;margin-bottom:4px}
.cond{margin:0;padding-left:20px}
textarea{width:100%;min-height:120px;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);resize:vertical}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score b{font-family:var(--mono);font-size:44px;line-height:1}
.tier{font-weight:700;padding:4px 12px;border-radius:999px}
.tier.t1{background:var(--good-soft);color:var(--good)} .tier.t2{background:var(--warn-soft);color:var(--warn)} .tier.t3{background:var(--bad-soft);color:var(--bad)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:start}
.checks .pt{font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.mark.y{color:var(--good)} .mark.n{color:var(--bad)}
.small{font-size:14px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{border-bottom:1px solid var(--line);padding:8px;text-align:left}
.tablebox{overflow-x:auto}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div class="wrap">
  <header>
    <span class="brand">커리어캐쳐 · AI 활용평가 연습</span>
    <div class="steps" id="steps" aria-label="진행 단계"></div>
  </header>
  <main id="app"></main>
  <p class="small">연습문제: 커리어캐쳐 자체 제작 · 제공된 AI 활용평가 예시의 문항 유형 참고</p>
</div>

<script>
const LIMIT = 90; // 문제당 1분 30초

const QUIZ = [
 {title:"[연습 1] 생성형 AI의 기능",
  passage:"청년센터의 이 주임은 취업 특강 안내문 초안과 홍보 포스터를 만들려고 합니다. 텍스트 생성형 AI에는 강의 주제와 대상자를 입력하고, 이미지 생성형 AI에는 “밝은 교육장에서 함께 배우는 청년들”이라는 장면을 설명했습니다.",
  q:"위 상황에서 두 가지 생성형 AI의 기능을 올바르게 설명한 것은 무엇인가요?",
  opts:["텍스트 생성형 AI는 저장된 안내문 하나를 검색해 그대로 복사하는 기능만 수행한다.",
        "텍스트 생성형 AI는 입력 문맥을 바탕으로 다음 토큰을 예측하며 문장을 생성한다.",
        "이미지 생성형 AI는 인터넷 사진을 찾아 보여줄 뿐 새로운 시각적 결과물을 만들 수 없다.",
        "이미지 생성형 AI가 만든 포스터에는 오탈자나 잘못된 시각적 표현이 생기지 않는다."],
  ans:1,
  why:"생성형 AI는 내가 넣은 문맥(주제·대상·장면 설명)을 바탕으로 새 결과물을 만듭니다. 그래서 무엇을 넣느냐가 결과를 좌우합니다.",
  trap:"①③은 AI를 ‘검색기’로 오해한 보기, ④는 AI 결과를 그대로 믿은 보기입니다. 이미지 속 글자는 특히 자주 틀립니다.",
  work:"안내문은 주제·대상·일시를 빠짐없이 넣고, 포스터 속 글자는 반드시 사람이 확인합니다."},
 {title:"[연습 2] 텍스트와 이미지의 역할",
  passage:"교육운영팀의 최 대리는 AI 어시스턴트로 교육 결과보고서를 세 문장으로 요약하고, 다음 교육을 홍보할 이미지를 만들려고 합니다. 보고서에는 교육 인원과 만족도 수치가 있으며, 홍보 이미지에는 실제 행사 사진을 사용하지 않습니다.",
  q:"업무 목적과 생성 결과의 특성을 고려할 때, 가장 적절한 활용 방법은 무엇인가요?",
  opts:["보고서 요약은 이미지 생성 기능에 맡기고, 홍보 장면은 텍스트 요약 기능으로 제작한다.",
        "AI가 자연스럽게 쓴 요약문은 신뢰할 수 있으므로 보고서의 인원과 수치를 다시 확인하지 않는다.",
        "생성한 홍보 이미지를 실제 교육 현장 사진으로 소개하면 현장감과 신뢰도를 높일 수 있다.",
        "텍스트 요약의 인원과 수치는 원문과 대조하고, 홍보 이미지는 원하는 장면을 설명해 생성한다."],
  ans:3,
  why:"목적에 맞는 도구를 고르고(요약은 텍스트, 장면은 이미지), 숫자는 원문과 대조하는 것이 올바른 활용입니다.",
  trap:"②는 ‘자연스러운 문장 = 정확한 사실’이라는 착각, ③은 생성 이미지를 실제 사진처럼 소개하는 윤리 문제입니다.",
  work:"AI 요약을 받으면 숫자·고유명사만 따로 원문과 맞춰 봅니다. 생성 이미지는 ‘AI 생성 이미지’로 밝힙니다."},
 {title:"[연습 3] 조건을 갖춘 프롬프트 설계",
  passage:"교육담당자는 AI로 사전·사후 역량점수 평균을 계산했습니다. 그런데 AI가 미응시자의 빈칸을 모두 0점으로 바꾸어 평균이 낮아졌습니다. 담당자는 미응시자는 해당 평균에서 제외하고, 유효 응시자 수와 평균을 함께 제시하기로 정했습니다.",
  q:"① 교육 데이터 분석가 역할 ② 정해진 미응시 처리 기준 ③ 표 출력 조건을 모두 충족하는 프롬프트는 무엇인가요?",
  opts:["너는 교육 데이터 분석가야. 미응시자는 0점으로 유지하고, 유효 응시자 수와 평균을 표로 정리해 줘.",
        "너는 홍보 담당자야. 미응시자는 각 평균에서 제외하고, 사전·사후 유효 응시자 수와 평균을 표로 정리해 줘.",
        "너는 교육 데이터 분석가야. 미응시자는 각 평균에서 제외하고, 사전·사후 유효 응시자 수와 평균을 표로 정리해 줘.",
        "너는 교육 데이터 분석가야. 미응시자는 각 평균에서 제외하고, 사전·사후 유효 응시자 수와 평균을 문장으로 설명해 줘."],
  ans:2,
  why:"역할·기준·형식 세 조건을 모두 담은 것은 ③뿐입니다. AI가 빈칸을 0점으로 바꾼 건 ‘기준’을 주지 않았기 때문입니다.",
  trap:"①은 기준, ②는 역할, ④는 형식이 하나씩 빠졌습니다. 세 보기 모두 그럴듯해서 한 줄씩 대조해야 보입니다.",
  work:"AI 결과가 이상하면 AI를 탓하기 전에 ‘내가 기준을 줬나?’부터 확인합니다."}
];

/* 채팅 게임: 조건을 보고 프롬프트를 직접 입력 → 컨텍스트 요소별 채점 */
const GAMES = [
 {from:"청년센터 이 주임",
  ask:"다음 주 취업 특강 안내문 좀 AI로 만들어 줄 수 있어요? 단톡방에 바로 올릴 거예요.",
  conds:["대상: 구직 중인 20대 청년","주제: AI로 자기소개서 다듬기","일시·장소: 11월 5일(수) 오후 2시, 청년센터 2층","형식: 단톡방용 5줄 이내, 신청 링크 자리 표시"],
  checks:[
   {k:"역할",pt:15,re:/(너는|당신은|역할|담당자|홍보|기획자|작가|카피)/,tip:"AI에게 ‘청년센터 홍보 담당자’ 같은 역할을 주세요."},
   {k:"목적·채널",pt:15,re:/(안내문|공지|단톡|카톡|메신저|홍보)/,tip:"어디에 쓰는 글인지(단톡방 안내문) 밝혀야 길이와 말투가 맞춰집니다."},
   {k:"대상",pt:15,re:/(청년|20대|구직)/,tip:"읽는 사람(구직 중인 20대 청년)을 넣어야 말투가 정해집니다."},
   {k:"핵심 정보",pt:25,re:[/(자기소개서|자소서)/,/(11월|5일|오후|2시|14시)/,/(2층|청년센터|장소)/],tip:"주제·일시·장소처럼 AI가 절대 알 수 없는 사실은 직접 넣어야 합니다."},
   {k:"형식",pt:20,re:/(\d+\s*줄|줄 이내|짧게|글머리|이모지|링크)/,tip:"‘5줄 이내’, ‘신청 링크 자리’처럼 결과 모양을 정해 주세요."},
   {k:"검증·제한",pt:10,re:/(확인|과장|지어내|없는 정보|빈칸|표시|틀리)/,tip:"‘모르는 정보는 지어내지 말고 [ ]로 비워 둬’ 같은 안전장치를 넣어 보세요."}],
  sample:"너는 청년센터 홍보 담당자야. 구직 중인 20대 청년에게 보낼 단톡방 안내문을 써 줘.\n주제: AI로 자기소개서 다듬기 / 일시: 11월 5일(수) 오후 2시 / 장소: 청년센터 2층\n5줄 이내로, 마지막 줄에 [신청 링크] 자리를 표시해 줘. 내가 주지 않은 정보는 지어내지 마."},
 {from:"교육운영팀 최 대리",
  ask:"교육 결과보고서를 팀장님께 세 문장으로 요약해서 보고해야 해요. AI한테 뭐라고 하면 될까요?",
  conds:["읽는 사람: 팀장 (바쁨, 숫자 위주로 봄)","보고서 수치: 참여 32명, 만족도 4.6점(5점 만점)","분량: 정확히 세 문장","숫자는 원문 그대로, 해석은 덧붙이지 않기"],
  checks:[
   {k:"역할",pt:10,re:/(너는|당신은|역할|담당자|분석가|비서)/,tip:"‘교육운영 담당자’처럼 관점을 정해 주세요."},
   {k:"목적·독자",pt:20,re:/(팀장|보고|상사|결재)/,tip:"누가 읽는지(팀장 보고용)를 밝혀야 핵심만 뽑습니다."},
   {k:"원문 제공",pt:15,re:/(보고서|원문|아래|붙여|첨부|내용)/,tip:"요약할 원문을 함께 준다고 명시해야 합니다."},
   {k:"핵심 수치",pt:20,re:[/(32|인원|참여)/,/(4\.6|만족도)/],tip:"꼭 들어가야 할 수치(인원·만족도)를 짚어 주세요."},
   {k:"형식",pt:15,re:/(세\s*문장|3\s*문장|세 줄|3줄)/,tip:"‘세 문장’처럼 분량을 숫자로 정해 주세요."},
   {k:"검증·제한",pt:20,re:/(그대로|바꾸지|정확|원문과|확인|지어내|추측|해석)/,tip:"‘숫자는 원문 그대로, 없는 해석은 넣지 마’처럼 검증 조건을 넣으세요."}],
  sample:"너는 교육운영 담당자야. 아래 교육 결과보고서를 팀장 보고용으로 정확히 세 문장으로 요약해 줘.\n참여 인원(32명)과 만족도(4.6점/5점)는 원문 숫자 그대로 쓰고, 보고서에 없는 해석이나 추측은 넣지 마.\n[보고서 원문 붙여넣기]"},
 {from:"교육담당자 박 주무관",
  ask:"사전·사후 역량점수 평균을 다시 내야 해요. 지난번엔 AI가 빈칸을 0점으로 계산해 버렸어요.",
  conds:["역할: 교육 데이터 분석가","기준: 미응시자(빈칸)는 해당 평균에서 제외","출력: 사전·사후 유효 응시자 수와 평균을 표로","소수점 첫째 자리까지"],
  checks:[
   {k:"역할",pt:15,re:/(분석가|분석 담당|데이터)/,tip:"‘교육 데이터 분석가’ 역할을 주세요."},
   {k:"처리 기준",pt:30,re:[/(미응시|빈칸|결측|공란)/,/(제외|빼고|빼서|0점으로 (하지|바꾸지|처리하지))/],tip:"이 업무의 핵심입니다. ‘미응시(빈칸)는 평균에서 제외’를 꼭 적으세요."},
   {k:"산출 항목",pt:20,re:[/(사전)/,/(사후)/,/(응시자 ?수|인원|유효)/],tip:"사전·사후 각각, 유효 응시자 수까지 달라고 하세요."},
   {k:"형식",pt:20,re:/(표|테이블|table)/i,tip:"‘표로 정리’처럼 출력 형식을 정하세요."},
   {k:"정밀도·검증",pt:15,re:/(소수|자리|반올림|검산|확인|계산 과정)/,tip:"‘소수점 첫째 자리’, ‘계산 과정도 보여 줘’로 확인할 수 있게 하세요."}],
  sample:"너는 교육 데이터 분석가야. 첨부한 사전·사후 역량점수에서 미응시자(빈칸)는 각 평균에서 제외해 줘. 0점으로 바꾸면 안 돼.\n사전·사후 각각 유효 응시자 수와 평균(소수점 첫째 자리)을 표로 정리하고, 아래에 계산 과정을 한 줄로 보여 줘."}
];

const S = {phase:"intro", qi:0, picked:null, left:LIMIT, quizScore:0, gi:0, gameScores:[], timer:null, revealed:false};
const app = document.getElementById("app");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CIRC = ["①","②","③","④"];

function steps(){
  const total = QUIZ.length + GAMES.length + 1;
  let cur = S.phase==="intro"?-1 : S.phase==="quiz"?S.qi : S.phase==="bridge"?QUIZ.length-1 : S.phase==="game"?QUIZ.length+S.gi : total-1;
  document.getElementById("steps").innerHTML = Array.from({length:total},(_,i)=>`<span class="${i<=cur?"on":""}"></span>`).join("");
}

function render(){
  steps(); clearInterval(S.timer);
  ({intro, quiz, bridge, game, result})[S.phase]();
  window.scrollTo({top:0});
}

function intro(){
  app.innerHTML = `<div class="panel">
    <p class="eyebrow">오늘의 순서</p>
    <h1>문제 3개를 풀고, AI에게 직접 일을 맡겨 봅니다</h1>
    <ol class="cond">
      <li><b>직접 풀어보기</b> — 문제당 1분 30초. 시간이 끝나면 정답과 해설이 열립니다.</li>
      <li><b>컨텍스트 채팅 게임</b> — 동료의 부탁을 보고, AI에게 보낼 질문을 직접 씁니다.</li>
      <li><b>내 질문 습관 결과</b> — 점수에 따라 상·중·하와 개선점을 안내합니다.</li>
    </ol>
    <div class="row"><button class="btn" id="go">시작하기</button></div></div>`;
  go.onclick = ()=>{S.phase="quiz";S.qi=0;S.quizScore=0;S.gameScores=[];startQ();};
}

function startQ(){S.picked=null;S.revealed=false;S.left=LIMIT;render();}

function fmt(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`}

function quiz(){
  const q = QUIZ[S.qi];
  app.innerHTML = `<div class="panel">
    <div class="timer" id="tm"><div class="bar"><i id="bar" style="width:${S.left/LIMIT*100}%"></i></div><span class="time" id="time">${fmt(S.left)}</span></div>
    <p class="eyebrow">직접 풀어보기 ${S.qi+1} / ${QUIZ.length}</p>
    <h2>${q.title}</h2>
    <div class="passage">${q.passage}</div>
    <p class="q">${q.q}</p>
    <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="num">${CIRC[i]}</span><span>${o}</span></button>`).join("")}</div>
    <div class="row"><button class="btn" id="sub" disabled>정답 확인</button></div>
    <div id="exp"></div></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(S.revealed) return; S.picked=+b.dataset.i;
    app.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===b)); sub.disabled=false;});
  sub.onclick = reveal;
  S.timer = setInterval(()=>{
    S.left--; time.textContent=fmt(Math.max(S.left,0)); bar.style.width=Math.max(S.left,0)/LIMIT*100+"%";
    tm.classList.toggle("low",S.left<=15);
    if(S.left<=0) reveal();
  },1000);
}

function reveal(){
  if(S.revealed) return; S.revealed=true; clearInterval(S.timer);
  const q = QUIZ[S.qi], ok = S.picked===q.ans; if(ok) S.quizScore++;
  app.querySelectorAll(".opt").forEach((b,i)=>{b.disabled=true;
    if(i===q.ans) b.classList.add("right"); else if(i===S.picked) b.classList.add("wrong");});
  sub.hidden=true;
  const last = S.qi===QUIZ.length-1;
  exp.innerHTML = `<div class="explain">
    <div class="verdict ${ok?"ok":"no"}">${S.picked===null?"시간 종료":ok?"정답입니다":"아쉬워요"} · 정답 ${CIRC[q.ans]}</div>
    <dl><dt>정답 이유</dt><dd>${q.why}</dd><dt>오답 함정</dt><dd>${q.trap}</dd><dt>실무에서는</dt><dd>${q.work}</dd></dl>
    <div class="row"><button class="btn" id="nx">${last?"결과 보고 게임으로":"다음 문제"}</button></div></div>`;
  nx.onclick = ()=>{ if(last){S.phase="bridge";render();} else {S.qi++;startQ();} };
}

function bridge(){
  app.innerHTML = `<div class="panel">
    <p class="eyebrow">풀어보기 결과</p>
    <h1>${QUIZ.length}문제 중 ${S.quizScore}문제 정답</h1>
    <p>세 문제의 공통점이 보이나요? 정답은 모두 <b>상황(컨텍스트)을 읽은 보기</b>였습니다.</p>
    <div class="tablebox"><table>
      <tr><th>문항</th><th>놓치기 쉬운 것</th></tr>
      <tr><td>연습 1</td><td>AI는 내가 넣은 문맥으로 만든다</td></tr>
      <tr><td>연습 2</td><td>목적에 맞는 도구 + 숫자 검증</td></tr>
      <tr><td>연습 3</td><td>역할 · 기준 · 형식</td></tr></table></div>
    <p>이제 반대로 해 봅니다. 동료가 일을 부탁하면, <b>여러분이 AI에게 보낼 질문을 직접</b> 써 주세요.</p>
    <div class="row"><button class="btn" id="go">채팅 게임 시작</button></div></div>`;
  go.onclick=()=>{S.phase="game";S.gi=0;render();};
}

function grade(g, text){
  const t = text.replace(/\s+/g," ");
  return g.checks.map(c=>{
    if(Array.isArray(c.re)){const hit=c.re.filter(r=>r.test(t)).length; return {...c,got:Math.round(c.pt*hit/c.re.length),hit,of:c.re.length};}
    const ok=c.re.test(t); return {...c,got:ok?c.pt:0,hit:ok?1:0,of:1};
  });
}
const tierOf = s => s>=80?["상","t1"]:s>=50?["중","t2"]:["하","t3"];

function game(){
  const g = GAMES[S.gi];
  app.innerHTML = `<div class="panel">
    <p class="eyebrow">컨텍스트 채팅 게임 ${S.gi+1} / ${GAMES.length}</p>
    <div class="chat">
      <div class="msg them"><span class="who">${g.from}</span>${g.ask}</div>
      <div class="msg them"><span class="who">${g.from}</span>참고할 조건이에요.
<ul class="cond">${g.conds.map(c=>`<li>${c}</li>`).join("")}</ul></div>
      <div id="log" class="chat"></div>
    </div>
    <label for="pr" class="q">AI에게 보낼 질문을 직접 써 보세요</label>
    <textarea id="pr" placeholder="예) 너는 … 야. … 을 위해 … 을 … 형식으로 만들어 줘."></textarea>
    <div class="row"><button class="btn" id="send">AI에게 보내기</button></div>
    <div id="res"></div></div>`;
  send.onclick = ()=>{
    const text = pr.value.trim();
    if(text.length<5){res.innerHTML=`<p class="small">질문을 한 문장 이상 써 주세요.</p>`;return;}
    const r = grade(g,text), score = r.reduce((a,c)=>a+c.got,0), [tn,tc]=tierOf(score);
    S.gameScores[S.gi] = {score, miss:r.filter(c=>c.got<c.pt).map(c=>c.k)};
    log.innerHTML = `<div class="msg me"><span class="who">나 → AI</span>${esc(text)}</div>`;
    pr.disabled=true; send.hidden=true;
    const last = S.gi===GAMES.length-1;
    res.innerHTML = `<div class="explain">
      <div class="score"><b>${score}</b><span>/ 100</span><span class="tier ${tc}">${tn}</span></div>
      <ul class="checks">${r.map(c=>`<li><span class="mark ${c.got===c.pt?"y":"n"}">${c.got===c.pt?"✓":c.got?"△":"✕"}</span><span><b>${c.k}</b>${c.got<c.pt?`<br><span class="small">${c.tip}</span>`:""}</span><span class="pt">${c.got}/${c.pt}</span></li>`).join("")}</ul>
      <details><summary>모범 질문 예시 보기</summary><div class="msg ai" style="max-width:100%;margin-top:8px">${esc(g.sample)}</div></details>
      <div class="row"><button class="btn ghost" id="re">다시 써 보기</button><button class="btn" id="nx">${last?"내 결과 보기":"다음 부탁"}</button></div></div>`;
    re.onclick=()=>render();
    nx.onclick=()=>{ if(last){S.phase="result";} else S.gi++; render(); };
  };
}

const ADVICE = {
 "상":["필요한 정보를 고르는 힘이 있습니다.","다음 단계: AI가 모르는 것을 먼저 되묻게 하세요. ‘부족한 정보가 있으면 먼저 질문해 줘’를 붙이면 결과가 한 번 더 좋아집니다.","검증 습관을 유지하세요. 숫자·고유명사는 원문과 대조합니다."],
 "중":["뼈대는 갖췄지만 한두 가지를 자주 빠뜨립니다.","보내기 전 10초 점검: 역할 · 목적 · 대상 · 기준 · 형식 · 검증 중 빠진 것이 있나요?","특히 ‘AI가 절대 알 수 없는 사실’(날짜, 장소, 수치, 처리 기준)은 직접 적어야 합니다."],
 "하":["지금은 AI에게 ‘알아서 해 줘’에 가깝게 묻고 있습니다.","한 줄 공식부터 시작하세요: ‘너는 ○○야. ○○을 위해 ○○을 ○○ 형식으로 만들어 줘.’","결과가 이상하면 AI를 탓하기 전에 ‘내가 무엇을 안 줬지?’부터 찾아보세요."]
};

function result(){
  const avg = Math.round(S.gameScores.reduce((a,c)=>a+(c?c.score:0),0)/GAMES.length);
  const [tn,tc]=tierOf(avg);
  const cnt={}; S.gameScores.forEach(g=>g&&g.miss.forEach(m=>cnt[m]=(cnt[m]||0)+1));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,2).map(e=>e[0]);
  app.innerHTML = `<div class="panel">
    <p class="eyebrow">내 질문 습관 결과</p>
    <div class="score"><b>${avg}</b><span>/ 100 평균</span><span class="tier ${tc}">${tn}</span></div>
    <p class="small">풀어보기 ${S.quizScore}/${QUIZ.length} 정답 · 채팅 게임 ${S.gameScores.map(g=>g?g.score:0).join(" · ")}점 · 상 80점 이상, 중 50~79점, 하 50점 미만</p>
    <h2>개선점</h2>
    <ul class="cond">${ADVICE[tn].map(a=>`<li>${a}</li>`).join("")}</ul>
    ${top.length?`<p><b>자주 빠뜨린 요소:</b> ${top.join(", ")}</p>`:`<p><b>모든 요소를 챙겼습니다.</b></p>`}
    <h2>보내기 전 체크리스트</h2>
    <ul class="checks">${["역할 — AI가 어떤 관점으로 답하나?","목적·대상 — 누가, 어디에 쓰나?","사실·기준 — AI가 모르는 정보와 처리 규칙은?","형식 — 표? 몇 줄? 몇 문장?","검증 — 결과에서 무엇을 다시 확인하나?"].map(t=>`<li><span class="mark y">□</span><span>${t}</span><span></span></li>`).join("")}</ul>
    <div class="row"><button class="btn ghost" id="go">처음부터 다시</button></div></div>`;
  go.onclick=()=>{S.phase="intro";render();};
}

render();
</script>
